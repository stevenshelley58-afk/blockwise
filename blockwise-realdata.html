<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blockwise — Meta ads for real estate agents</title>
<style>
  :root{
    --ink:#0f1115; --ink-soft:#3a3f4a; --muted:#6b7280;
    --line:#e7e8ec; --bg:#fafbfc; --panel:#f6f7f9; --panel-2:#eef0f3;
    --accent:#1f6feb; --accent-soft:rgba(31,111,235,.12);
    --green:#1a7f4b; --green-dot:#23a35e;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px}
  a{color:inherit;text-decoration:none}

  /* ---------- nav ---------- */
  .nav{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;max-width:1136px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:9px;font:700 18px/1 inherit;letter-spacing:-.01em}
  .brand .mark{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#0b3d91)}
  .nav__links{display:flex;gap:26px;font:500 14.5px/1 inherit;color:var(--ink-soft)}
  .nav__links a:hover{color:var(--ink)}
  .nav__cta{display:flex;align-items:center;gap:16px}
  .nav__login{font:500 14.5px/1 inherit;color:var(--ink-soft)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:600 15px/1 inherit;border:0;border-radius:11px;padding:0 20px;height:50px;cursor:pointer;white-space:nowrap;transition:transform .08s ease,opacity .15s ease}
  .btn:active{transform:translateY(1px)}
  .btn--ink{background:var(--ink);color:#fff}
  .btn--ink:hover{opacity:.92}
  .btn--sm{height:40px;padding:0 15px;font-size:14px;border-radius:10px}
  .btn--ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}

  /* ---------- hero ---------- */
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 13px/1 inherit;color:var(--ink-soft);background:#fff;border:1px solid var(--line);padding:7px 13px;border-radius:999px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .hero{text-align:center;padding:56px 0 60px}
  .hero h1{font:700 clamp(34px,5vw,56px)/1.06 inherit;letter-spacing:-.02em;margin:22px auto 16px;max-width:20ch;text-wrap:balance}
  .hero .sub{font:400 19px/1.5 inherit;color:var(--ink-soft);max-width:48ch;margin:0 auto}
  .trial{font:500 13.5px/1 inherit;color:var(--muted);margin-top:18px}
  .trial b{color:var(--ink-soft);font-weight:600}

  /* ---------- search + typeahead ---------- */
  .searchwrap{position:relative;max-width:580px;margin:30px auto 0}
  .searchbar{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 8px 8px 16px;box-shadow:0 8px 30px rgba(15,17,21,.06);transition:border-color .15s ease,box-shadow .15s ease}
  .searchbar.is-open{border-color:var(--accent);box-shadow:0 8px 30px rgba(31,111,235,.16)}
  .searchbar svg{width:20px;height:20px;color:var(--muted);flex:0 0 auto}
  .searchbar input{flex:1;border:0;outline:0;font:400 16px/1 inherit;color:var(--ink);background:transparent}
  .ac{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 22px 50px rgba(15,17,21,.14);padding:7px;z-index:30;display:none;text-align:left;max-height:340px;overflow:auto}
  .ac.is-open{display:block}
  .ac__group{font:600 11px/1 inherit;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:11px 12px 6px}
  .ac__item{display:flex;align-items:center;gap:12px;padding:9px 11px;border-radius:10px;cursor:pointer}
  .ac__item:hover,.ac__item.is-active{background:var(--panel)}
  .ac__ico{width:32px;height:32px;border-radius:9px;background:var(--panel-2);display:grid;place-items:center;flex:0 0 auto;color:var(--ink-soft)}
  .ac__ico svg{width:16px;height:16px}
  .ac__txt b{display:block;font:600 14.5px/1.2 inherit}
  .ac__txt span{font:500 12.5px/1 inherit;color:var(--muted)}
  .ac__count{margin-left:auto;font:600 12.5px/1 inherit;color:var(--accent);background:var(--accent-soft);padding:5px 9px;border-radius:7px}
  .ac__empty{padding:18px 14px;color:var(--muted);font:500 14px/1.4 inherit}

  /* ---------- hero ad strip (pre-search) ---------- */
  .adrow{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:760px;margin:46px auto 0}
  .adcard{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(15,17,21,.05);text-align:left}
  .adcard__img{position:relative;height:118px}
  .adcard__img span.tag{position:absolute;top:10px;left:10px;font:600 11px/1 inherit;color:var(--ink);background:rgba(255,255,255,.92);padding:6px 9px;border-radius:7px}
  .g1{background:linear-gradient(135deg,#c7d2fe,#93a5e8)}
  .g2{background:linear-gradient(135deg,#bfe3d0,#8fcaa6)}
  .g3{background:linear-gradient(135deg,#fcd9b6,#f3b985)}
  .g4{background:linear-gradient(135deg,#f5c6d6,#e495b3)}
  .g5{background:linear-gradient(135deg,#cdd3da,#9aa6b2)}
  .g6{background:linear-gradient(135deg,#bfe0e8,#86bdcb)}
  .adcard figcaption{padding:11px 13px 13px}
  .adcard figcaption b{display:block;font:600 13.5px/1.2 inherit;color:var(--ink)}
  .adcard figcaption span{font:500 11.5px/1 inherit;color:var(--muted);display:block;margin-top:4px}
  .adrow__note{text-align:center;font:500 13px/1 inherit;color:var(--muted);margin-top:20px}

  /* ---------- how it works ---------- */
  .how{padding:58px 0 70px;border-top:1px solid var(--line)}
  .how__head{text-align:center;margin-bottom:44px}
  .how__head h2{font:700 clamp(26px,3.5vw,38px)/1.1 inherit;letter-spacing:-.02em;margin-top:16px}
  .how__steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(15,17,21,.04)}
  .how__step{position:relative;padding:32px 28px 30px;border-right:1px solid var(--line)}
  .how__step:last-child{border-right:0}
  .how__n{position:absolute;top:28px;right:28px;font:700 12.5px/1 inherit;color:var(--muted)}
  .how__ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:18px;color:var(--accent);background:var(--accent-soft)}
  .how__ico svg{width:21px;height:21px}
  .how__step h3{font:700 18px/1.2 inherit;letter-spacing:-.01em;margin-bottom:8px}
  .how__step p{font:400 14.5px/1.5 inherit;color:var(--ink-soft)}
  @media(max-width:760px){.how__steps{grid-template-columns:1fr}.how__step{border-right:0;border-bottom:1px solid var(--line)}.how__step:last-child{border-bottom:0}}

  /* ---------- dashboard showcase ---------- */
  .dash{padding:18px 0 74px}
  .dash__head{text-align:center;margin-bottom:38px}
  .dash__head h2{font:700 clamp(26px,3.5vw,38px)/1.1 inherit;letter-spacing:-.02em;margin-top:16px}
  .dash__head .lead{font:400 17px/1.55 inherit;color:var(--ink-soft);max-width:50ch;margin:14px auto 0}
  .board{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px rgba(15,17,21,.08);overflow:hidden}
  .board__bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 22px;border-bottom:1px solid var(--line)}
  .board__title{display:flex;align-items:center;gap:12px;font:700 15px/1 inherit}
  .board__live{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 inherit;color:var(--green)}
  .board__live i{width:7px;height:7px;border-radius:50%;background:var(--green-dot);box-shadow:0 0 0 3px rgba(35,163,94,.16);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .board__range{display:flex;gap:3px;background:var(--panel);border-radius:9px;padding:3px}
  .board__range button{border:0;background:transparent;font:600 12.5px/1 inherit;color:var(--muted);padding:7px 12px;border-radius:7px;cursor:pointer}
  .board__range button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,17,21,.1)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
  .kpi{padding:20px 22px;border-right:1px solid var(--line)}
  .kpi:last-child{border-right:0}
  .kpi__k{font:600 11.5px/1 inherit;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
  .kpi__v{font:700 28px/1 inherit;letter-spacing:-.02em;margin:13px 0 9px}
  .delta{display:inline-flex;align-items:center;gap:4px;font:600 12.5px/1 inherit;color:var(--green)}
  .delta--muted{color:var(--muted)}
  .board__chart{padding:24px 20px 6px}
  .board__chart svg{width:100%;height:auto;display:block}
  .chart-legend{display:flex;gap:20px;padding:6px 24px 20px;font:500 12.5px/1 inherit;color:var(--muted)}
  .chart-legend span{display:inline-flex;align-items:center;gap:7px}
  .chart-legend i{width:11px;height:11px;border-radius:3px}
  .camps{border-top:1px solid var(--line)}
  .crow{display:grid;grid-template-columns:1.7fr .9fr .7fr .8fr;gap:10px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);font:500 14px/1 inherit}
  .crow:last-child{border-bottom:0}
  .crow--head{font:600 11.5px/1 inherit;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--panel)}
  .crow__name{font-weight:600;color:var(--ink)}
  .crow__num{text-align:right;font-variant-numeric:tabular-nums}
  .cstatus{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1 inherit}
  .cstatus i{width:7px;height:7px;border-radius:50%}
  .cstatus--active{color:var(--green)} .cstatus--active i{background:var(--green-dot)}
  .cstatus--paused{color:#9a6f1f} .cstatus--paused i{background:#c79534}
  @media(max-width:760px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .kpi:nth-child(2){border-right:0}
    .kpi:nth-child(1),.kpi:nth-child(2){border-bottom:1px solid var(--line)}
    .crow{grid-template-columns:1.4fr .8fr .8fr}
    .crow__spend{display:none}
  }

  /* ---------- trust & control ---------- */
  .trust{padding:18px 0 76px}
  .trust__grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
  .trust__copy h2{font:700 clamp(26px,3.4vw,36px)/1.12 inherit;letter-spacing:-.02em;margin:16px 0 0}
  .trust__copy .lead{font:400 17px/1.55 inherit;color:var(--ink-soft);margin:16px 0 0;max-width:42ch}
  .checks{list-style:none;margin:26px 0 0;display:grid;gap:14px}
  .checks li{display:flex;align-items:flex-start;gap:12px;font:500 15.5px/1.4 inherit;color:var(--ink)}
  .checks svg{width:22px;height:22px;flex:0 0 auto;color:var(--green);margin-top:-1px}
  .approve{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px rgba(15,17,21,.08);padding:22px;display:flex;flex-direction:column;gap:16px}
  .approve__top{display:flex;align-items:center;justify-content:space-between;font:700 14px/1 inherit}
  .approve__tag{font:600 12px/1 inherit;color:var(--accent);background:var(--accent-soft);padding:6px 10px;border-radius:8px}
  .approve__ad{display:flex;gap:13px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px}
  .approve__img{width:58px;height:58px;border-radius:10px;flex:0 0 auto}
  .approve__adtxt b{display:block;font:600 14px/1.25 inherit}
  .approve__adtxt span{display:block;font:500 12.5px/1.4 inherit;color:var(--muted);margin-top:4px}
  .approve__rows{display:grid;gap:0;border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .approve__rows div{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font:500 13.5px/1 inherit}
  .approve__rows div:last-child{border-bottom:0}
  .approve__rows span{color:var(--muted)}
  .approve__rows b{font-weight:600;color:var(--ink)}
  .approve__btns{display:flex;gap:10px}
  .approve__note{font:500 12px/1.4 inherit;color:var(--muted);text-align:center;margin-top:-2px}
  @media(max-width:760px){.trust__grid{grid-template-columns:1fr;gap:34px}}

  /* ---------- pricing ---------- */
  .pricing{padding:18px 0 80px;border-top:1px solid var(--line)}
  .pricing__head{text-align:center;margin:46px 0 40px}
  .pricing__head h2{font:700 clamp(26px,3.5vw,38px)/1.1 inherit;letter-spacing:-.02em;margin-top:16px}
  .pricing__head .lead{font:400 17px/1.5 inherit;color:var(--ink-soft);margin:14px auto 0;max-width:46ch}
  .ptiers{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:start}
  .ptier{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px 26px;box-shadow:0 10px 30px rgba(15,17,21,.04);display:flex;flex-direction:column}
  .ptier--pop{border:1.5px solid var(--accent);box-shadow:0 24px 60px rgba(31,111,235,.14);position:relative}
  .ptier__badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font:600 11.5px/1 inherit;letter-spacing:.04em;text-transform:uppercase;padding:7px 12px;border-radius:999px}
  .ptier__name{font:700 16px/1 inherit;letter-spacing:-.01em}
  .ptier__price{font:700 40px/1 inherit;letter-spacing:-.03em;margin:18px 0 2px}
  .ptier__price em{font:600 15px/1 inherit;font-style:normal;color:var(--muted)}
  .ptier__per{font:500 13px/1 inherit;color:var(--muted)}
  .ptier__desc{font:400 14px/1.5 inherit;color:var(--ink-soft);margin:14px 0 20px;min-height:42px}
  .ptier .btn{width:100%;justify-content:center}
  .plist{list-style:none;margin:22px 0 0;display:grid;gap:12px}
  .plist li{display:flex;align-items:flex-start;gap:10px;font:500 14px/1.4 inherit;color:var(--ink)}
  .plist svg{width:19px;height:19px;flex:0 0 auto;color:var(--green);margin-top:0}
  .pricing__note{text-align:center;font:500 13.5px/1 inherit;color:var(--muted);margin-top:30px}
  @media(max-width:760px){.ptiers{grid-template-columns:1fr}.ptier--pop{order:-1}}

  /* ---------- results ---------- */
  .results{display:none;padding:8px 0 70px}
  .results.is-open{display:block}
  .results__head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
  .results__title{font:700 26px/1.15 inherit;letter-spacing:-.01em}
  .results__title em{font-style:normal;color:var(--accent)}
  .results__sub{font:500 14px/1 inherit;color:var(--muted);margin-top:8px}
  .results__back{display:inline-flex;align-items:center;gap:7px;font:600 14px/1 inherit;color:var(--ink-soft);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
  .results__back:hover{color:var(--ink)}
  .filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:8px}
  .chip{font:600 13.5px/1 inherit;color:var(--ink-soft);background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;transition:all .12s ease}
  .chip:hover{border-color:#cfd2d8}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .filters--platform{margin-bottom:24px}
  .filters--platform .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}

  /* results control bar */
  .resbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;padding-top:18px;border-top:1px solid var(--line)}
  .summary{font:500 13.5px/1.5 inherit;color:var(--muted)}
  .summary b{color:var(--ink);font-weight:700}
  .summary .sep{margin:0 9px;opacity:.4}
  .sort{display:inline-flex;align-items:center;gap:8px;font:600 13px/1 inherit;color:var(--ink-soft)}
  .sort select{font:600 13.5px/1 inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer}
  .loadmore{display:none;justify-content:center;margin-top:30px}
  .loadmore.is-open{display:flex}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .ad{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(15,17,21,.05);display:flex;flex-direction:column;animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .ad__media{position:relative;height:150px}
  .ad__angle{position:absolute;top:11px;left:11px;font:600 11px/1 inherit;color:var(--ink);background:rgba(255,255,255,.93);padding:6px 10px;border-radius:8px}
  .ad__plat{position:absolute;top:11px;right:11px;width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.93);display:grid;place-items:center}
  .ad__plat svg{width:15px;height:15px}
  .ad__body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
  .ad__agency{display:flex;align-items:center;gap:8px;font:600 13px/1 inherit;color:var(--ink)}
  .ad__avatar{width:24px;height:24px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;font:700 11px/1 inherit;color:var(--ink-soft)}
  .ad__copy{font:500 14px/1.4 inherit;color:var(--ink-soft)}
  .ad__meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
  .ad__live{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 inherit;color:var(--green)}
  .ad__live i{width:6px;height:6px;border-radius:50%;background:var(--green-dot);box-shadow:0 0 0 3px rgba(35,163,94,.16)}
  .ad__use{font:600 12.5px/1 inherit;color:var(--accent);background:var(--accent-soft);border:0;border-radius:8px;padding:8px 11px;cursor:pointer}
  .ad__use:hover{background:rgba(31,111,235,.2)}

  .noresults{text-align:center;padding:50px 20px;color:var(--muted);font:500 15px/1.5 inherit}

  /* ---------- closing CTA ---------- */
  .cta{margin:6px 0 66px;background:var(--ink);border-radius:24px;padding:62px 40px;text-align:center;color:#fff}
  .cta .eyebrow{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#d4d8df}
  .cta .eyebrow .dot{box-shadow:0 0 0 4px rgba(255,255,255,.12)}
  .cta h2{font:700 clamp(28px,3.8vw,42px)/1.08 inherit;letter-spacing:-.025em;margin:18px auto 0;max-width:17ch;color:#fff}
  .cta p{font:400 17px/1.55 inherit;color:#aeb4be;margin:15px auto 0;max-width:44ch}
  .cta__btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  .btn--white{background:#fff;color:var(--ink)}
  .btn--white:hover{opacity:.92}
  .btn--outline{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff}
  .btn--outline:hover{background:rgba(255,255,255,.08)}

  /* ---------- footer ---------- */
  .site{border-top:1px solid var(--line);background:#fff}
  .foot{max-width:1080px;margin:0 auto;padding:52px 28px 32px;display:grid;grid-template-columns:1.7fr .8fr .8fr .8fr;gap:30px}
  .foot__brand{display:flex;align-items:center;gap:9px;font:700 18px/1 inherit}
  .foot__brand .mark{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#0b3d91)}
  .foot__brand-col p{font:400 14px/1.6 inherit;color:var(--muted);margin:14px 0 0;max-width:34ch}
  .foot__mail{display:inline-block;margin-top:14px;font:600 14px/1 inherit;color:var(--accent)}
  .foot__col h4{font:700 12px/1 inherit;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);margin-bottom:15px}
  .foot__col a{display:block;font:500 14px/1 inherit;color:var(--ink-soft);margin-bottom:11px}
  .foot__col a:hover{color:var(--ink)}
  .foot__bot{border-top:1px solid var(--line)}
  .foot__bot > div{max-width:1080px;margin:0 auto;padding:18px 28px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font:500 13px/1 inherit;color:var(--muted)}
  @media(max-width:760px){.foot{grid-template-columns:1fr 1fr}.foot__brand-col{grid-column:1/-1}}

  /* ---------- motion & polish ---------- */
  @media (prefers-reduced-motion: no-preference){
    body.anim .reveal{opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
    body.anim .reveal.in{opacity:1;transform:none}
    body.anim .stagger > *{opacity:0;transform:translateY(18px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
    body.anim .stagger.in > *{opacity:1;transform:none}
    body.anim .stagger.in > *:nth-child(1){transition-delay:.04s}
