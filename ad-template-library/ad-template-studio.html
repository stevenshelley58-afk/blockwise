<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockwise Ad Template Studio</title>
<style>
:root{color-scheme:light;--navy:#16314f;--navy2:#0e2236;--teal:#2E7D6B;--gold:#E7B24B;--ink:#10202f;--line:#e2e8ee;--bg:#f5f7f9;--muted:#5b6b7b}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:18px 22px}
header h1{margin:0;font-size:20px}
header p{margin:6px 0 0;color:#ccdae6;font-size:12.5px;max-width:900px;line-height:1.5}
.viewtoggle{display:inline-flex;gap:0;margin-top:12px;background:#0a1a2b;border-radius:999px;padding:3px}
.viewtoggle button{border:none;background:transparent;color:#9fb6c9;font-weight:700;padding:7px 16px;border-radius:999px;cursor:pointer;font-size:12.5px}
.viewtoggle button.on{background:var(--gold);color:var(--ink)}
.viewhint{margin-top:8px;font-size:11.5px;color:#9fb6c9}
.wrap{padding:16px 22px 60px}
.tabs{display:flex;gap:6px;margin:14px 0 6px;flex-wrap:wrap}
.tab{padding:8px 16px;border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.bar input[type=text]{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px}
select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12.5px;color:var(--ink)}
.count{color:var(--muted);font-size:12px;margin-left:auto}
button.act{padding:8px 14px;border:none;border-radius:8px;background:var(--teal);color:#fff;font-weight:600;cursor:pointer}
button.act:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;gap:9px;box-shadow:0 1px 2px rgba(16,32,47,.04)}
.card.clean{gap:11px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.score{font-weight:800;font-size:13px;color:#fff;border-radius:8px;padding:3px 9px}
.s-hi{background:#2e7d4f}.s-mid{background:#b9892b}.s-lo{background:#b4583a}
.id{font-size:11px;font-weight:700;color:var(--teal);background:#eaf3f0;border-radius:6px;padding:2px 7px}
.tag{font-size:10.5px;color:var(--muted);background:#eef2f6;border-radius:999px;padding:3px 9px;white-space:nowrap}
.tag.cat{background:#16314f;color:#fff}
.tag.fmt{background:#e7eefc;color:#1f4ea3}
.tag.hook{background:#fdf0dc;color:#9a6a16}
h3.t{margin:2px 0 0;font-size:15.5px;line-height:1.25}
.copy{background:#f7fafb;border:1px dashed #d4dde4;border-radius:8px;padding:9px 10px;font-size:13px;line-height:1.5;white-space:pre-wrap;position:relative}
.clean .copy{background:#fff;border:1px solid #eef2f6}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:2px;font-weight:700}
.cta{display:inline-block;background:var(--gold);color:var(--ink);font-weight:700;border-radius:8px;padding:5px 12px;font-size:12.5px}
.meta{font-size:11.5px;color:var(--muted);line-height:1.5}
.meta b{color:var(--ink)}
.meta code{background:#eef2f6;border-radius:4px;padding:1px 5px;font-size:11px}
.copybtn{position:absolute;top:6px;right:6px;font-size:10.5px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 7px;cursor:pointer;color:var(--muted)}
.brief{font-size:11.5px;background:#f3f6f8;border-radius:8px;padding:8px 10px;color:#3c4a59;line-height:1.5}
.visual{font-size:12px;color:#41526180;color:#5b6b7b}
.visual b{color:var(--ink)}
details summary{cursor:pointer;font-size:12px;color:var(--teal);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted)}
.legend{font-size:11px;color:var(--muted);margin:2px 0 0}
.win .b{font-size:12.5px;color:#33414f;line-height:1.45}
.bars{display:flex;gap:3px;margin-top:2px}
.bk{height:5px;border-radius:3px;background:#e2e8ee;flex:1}
.bk.f{background:var(--teal)}
.pill{font-size:10.5px;border-radius:999px;padding:2px 8px;background:#eef2f6;color:var(--muted)}
.pill.on{background:#2e7d4f;color:#fff}
</style></head>
<body>
<header>
<h1>Blockwise — Ad Template Studio</h1>
<p id="lead">Ready-to-use real-estate ad templates, built from what actually works.</p>
<div class="viewtoggle">
  <button id="vClient" class="on" onclick="setView('client')">Client view</button>
  <button id="vBuild" onclick="setView('build')">Build view · dev + management</button>
</div>
<div class="viewhint" id="vhint"></div>
</header>
<div class="wrap">
<div class="tabs">
  <div class="tab on" id="tabLib" data-tab="lib" onclick="setTab('lib')">Templates</div>
  <div class="tab" id="tabWin" data-tab="win" onclick="setTab('win')" style="display:none">Winning ads — evidence</div>
</div>

<div id="lib">
  <div class="bar">
    <input type="text" id="q" placeholder="Search headline, copy or angle..." oninput="render()">
    <select id="f_cat" onchange="render()"></select>
    <select id="f_aud" onchange="render()"></select>
    <select id="f_fmt" onchange="render()"></select>
    <select id="f_hook" onchange="render()"></select>
    <select id="f_fun" onchange="render()"></select>
    <span class="count" id="cnt"></span>
  </div>
  <div class="grid" id="cards"></div>
</div>

<div id="win" style="display:none">
  <div class="bar">
    <input type="text" id="wq" placeholder="Search winning ads..." oninput="renderWin()">
    <select id="w_cat" onchange="renderWin()"></select>
    <select id="w_fmt" onchange="renderWin()"></select>
    <select id="w_active" onchange="renderWin()"><option value="">Any status</option><option value="active">Active only</option></select>
    <select id="w_days" onchange="renderWin()"><option value="0">Any duration</option><option value="90">90+ days</option><option value="180">180+ days</option><option value="365">1+ year</option></select>
    <button class="act" id="refresh" onclick="refresh()">Refresh from live DB</button>
    <span class="count" id="wcnt"></span>
  </div>
  <div class="legend" id="wsrc"></div>
  <div class="grid win" id="wcards"></div>
</div>
</div>

isal", "f": "image", "ag": "(independent)", "cat": "Home Value / Appraisal", "h": "Free Appraisal With Alyssa", "b": "Free appraisals in Mundijong & Whitby - want to know what your home is worth? The market is strong, buyer demand is high, a great time to sell.", "cta": "Book now"}, {"s": 66, "d": 88, "v": 8, "st": "active", "t": "appraisal", "f": "carousel", "ag": "(independent)", "cat": "Home Value / Appraisal", "h": "Do you know what your property is worth?", "b": "Property values in Ellenbrook, Brabham, Aveley and The Vines are on the move. Would you like to learn what your property could fetch?", "cta": "Learn More"}, {"s": 71, "d": 211, "v": 3, "st": "active", "t": "listing", "f": "carousel", "ag": "(developer)", "cat": "New Development / Off-the-Plan", "h": "Come Home to City Views | Bushmead", "b": "In the heart of Perth's historic, fast-growing eastern corridor, just 16km from the CBD - a sustainable community with parks and trails.", "cta": "Learn More"}, {"s": 65, "d": 288, "v": 4, "st": "active", "t": "agency_brand", "f": "image", "ag": "INVIDA", "cat": "Investor / Co-living", "h": "Thinking about downsizing for retirement?", "b": "Discover how co-living can help you live better and earn extra in the process. Click to read the full breakdown.", "cta": "Learn more"}]};const EX={"suburb": "Mosman Park", "suburb_list": "Mosman Park, Cottesloe & Peppermint Grove", "agent_name": "Sarah Chen", "business_name": "Ray White", "property_type": "home", "price": "$650,000", "median_value": "$1.2M", "growth_12m": "12.4%", "growth_5y": "61%", "active_buyers": "1,358", "edition": "Q2 2026", "address": "12 Bay Street", "beds": "4", "baths": "2", "cars": "2", "land": "620m²", "project_name": "Horizon Residences", "project_or_address": "Horizon Residences", "landmark": "Whiteman Park Station", "deposit_pct": "5%", "date": "Sat 21 June", "day": "Saturday", "time": "11:00am", "property_desc": "a 4-bed family home", "bidders": "8", "rent_before": "$600", "rent_after": "$2,000", "quote": "They made selling stress-free and got us a great result.", "client_name": "Steven & Jen", "guide_title": "Sell for Top Dollar"};const PROJECT="uwwbvdloschaccycjozr";const WINNER_SQL="WITH base AS (SELECT o.id, ag.name agency, o.active_status, o.last_seen_at, GREATEST(0,(COALESCE(o.ad_delivery_stopped_at,o.last_seen_at,now())::date-COALESCE(o.ad_delivery_started_at,o.first_seen_at)::date)) d, c.ad_type t, c.format f, c.headline, c.body, c.cta, (SELECT count(*) FROM research.ad_creative_versions v WHERE v.observed_ad_id=o.id) v FROM research.observed_ads o JOIN research.ad_creatives c ON c.observed_ad_id=o.id LEFT JOIN research.advertiser_pages p ON p.id=o.advertiser_page_id LEFT JOIN research.agencies ag ON ag.id=p.agency_id WHERE c.classification->>'is_real_estate_ad'='true' AND c.body IS NOT NULL AND length(trim(c.body))>0 AND position('{{' in coalesce(c.headline,'')||coalesce(c.body,''))=0 AND c.body !~* '(costa del sol|marbella|estepona|benahav|\u20ac)'), scored AS (SELECT *, round(LEAST(d,365)/365.0*40 + CASE WHEN active_status='active' THEN 15 ELSE 0 END + LEAST(v,10)/10.0*20 + CASE WHEN last_seen_at>=now()-interval '30 days' THEN 10 ELSE 0 END + CASE WHEN headline IS NOT NULL AND cta IS NOT NULL THEN 15 ELSE 0 END,0) s FROM base), dd AS (SELECT DISTINCT ON (lower(left(body,55))) coalesce(agency,'(independent)') ag, active_status st, d, v, t, f, s, left(coalesce(headline,''),80) h, left(regexp_replace(body,'\\s+',' ','g'),190) b, coalesce(cta,'') cta FROM scored ORDER BY lower(left(body,55)), s DESC) SELECT json_agg(row_to_json(dd) ORDER BY s DESC) FROM (SELECT * FROM dd ORDER BY s DESC LIMIT 120) dd;";</script>
<script>
let VIEW='client';
function sCls(n){return n>=85?'s-hi':n>=72?'s-mid':'s-lo'}
function opt(sel,vals,all){const e=document.getElementById(sel);e.innerHTML='<option value="">'+all+'</option>'+vals.map(v=>'<option>'+v+'</option>').join('')}
function tmplById(cat){return (DATA.templates.find(t=>t.category===cat)||{}).id||''}
const FUN_SHORT={'TOFU (awareness)':'TOFU','MOFU (consideration)':'MOFU','BOFU (direct response)':'BOFU'}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fill(s){return (s||'').replace(/\{\{(\w+)\}\}/g,(m,k)=>EX[k]||k.replace(/_/g,' '))}
function copyText(btn,txt){try{navigator.clipboard&&navigator.clipboard.writeText(txt)}catch(e){};btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',1200)}

opt('f_cat',DATA.facets.category,'All angles');opt('f_aud',DATA.facets.audience,'All audiences');
opt('f_fmt',DATA.facets.format,'All formats');opt('f_hook',DATA.facets.hook_style,'All hooks');
opt('f_fun',DATA.facets.funnel_stage,'All funnel stages');
opt('w_cat',DATA.facets.category,'All angles');opt('w_fmt',['image','video','carousel'],'All formats');

function setView(v){
  VIEW=v;
  document.getElementById('vClient').classList.toggle('on',v==='client');
  document.getElementById('vBuild').classList.toggle('on',v==='build');
  // build-only facets + evidence tab
  ['f_hook','f_fun'].forEach(id=>document.getElementById(id).style.display=(v==='build')?'':'none');
  document.getElementById('tabWin').style.display=(v==='build')?'':'none';
  document.getElementById('lead').textContent = v==='client'
    ? 'Ready-to-use real-estate ad templates, built from what actually works. Copy, tweak the details for your suburb, and post.'
    : 'Build view — every template with its backend tokens, AdStudio offer/goal mapping, image direction, evidence and quality score.';
  document.getElementById('vhint').textContent = v==='client'
    ? 'Showing the clean, client-ready copy with example details filled in.'
    : 'Showing internal fields for dev + management. Tokens like {{suburb}} are the backend merge fields.';
  if(v==='client') setTab('lib');
  render();
}
function setTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));
  document.getElementById('lib').style.display=t==='lib'?'':'none';
  document.getElementById('win').style.display=t==='win'?'':'none';}

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const fc=f_cat.value,fa=f_aud.value,ff=f_fmt.value,fh=f_hook.value,fu=f_fun.value;
  const rows=DATA.templates.filter(t=>{
    if(fc&&t.category!==fc)return 0; if(fa&&!t.audience.includes(fa))return 0;
    if(ff&&!t.format.includes(ff))return 0;
    if(VIEW==='build'){ if(fh&&t.hook_style!==fh)return 0; if(fu&&t.funnel_stage!==fu)return 0; }
    if(q){const hay=(t.name+' '+fill(t.headline)+' '+fill(t.primary_text)+' '+t.description+' '+t.category+' '+t.audience.join(' ')).toLowerCase();if(!hay.includes(q))return 0}
    return 1;});
  document.getElementById('cnt').textContent=rows.length+' / '+DATA.templates.length+' templates';
  const fn = VIEW==='client'?cleanCard:buildCard;
  document.getElementById('cards').innerHTML = rows.length?rows.map(fn).join(''):'<div class="empty">No templates match those filters.</div>';
}

function cleanCard(t){
  const br=DATA.briefs[t.image_brief]||{};
  const hl=fill(t.headline), pt=fill(t.primary_text), ds=fill(t.description);
  return `<div class="card clean">
   <div class="row"><span class="tag cat">${esc(t.category)}</span>
     <span class="tag fmt">${esc(t.format.join(' / '))}</span>
     ${t.audience.slice(0,3).map(a=>`<span class="tag">${esc(a)}</span>`).join('')}</div>
   <h3 class="t">${esc(hl)}</h3>
   <div><div class="lbl">Ad text</div><div class="copy">${esc(pt)}<span class="copybtn" onclick="copyText(this,${JSON.stringify(pt)})">Copy</span></div></div>
   <div class="row"><span class="cta">${esc(t.cta)}</span><span class="meta">${esc(ds)}</span></div>
   <div class="visual"><b>Visual idea:</b> ${esc(br.concept||'')}</div>
  </div>`;
}

function buildCard(t){
  const br=DATA.briefs[t.image_brief]||{};
  return `<div class="card">
   <div class="row"><span class="score ${sCls(t.evidence_score)}">${t.evidence_score}</span>
     <span class="id">${t.id}</span><span class="tag cat">${esc(t.category)}</span>
     <span class="tag fmt">${esc(t.format.join(' / '))}</span></div>
   <h3 class="t">${esc(t.name)}</h3>
   <div class="row"><span class="tag hook">${esc(t.hook_style)}</span><span class="tag">${FUN_SHORT[t.funnel_stage]||''}</span>
     ${t.audience.map(a=>`<span class="tag">${esc(a)}</span>`).join('')}</div>
   <div><div class="lbl">Headline (backend tokens)</div><div class="copy">${esc(t.headline)}<span class="copybtn" onclick="copyText(this,${JSON.stringify(t.headline)})">Copy</span></div></div>
   <div><div class="lbl">Primary text (backend tokens)</div><div class="copy">${esc(t.primary_text)}<span class="copybtn" onclick="copyText(this,${JSON.stringify(t.primary_text)})">Copy</span></div></div>
   <div class="row"><span class="cta">${esc(t.cta)}</span><span class="meta">${esc(t.description)}</span></div>
   <div class="meta"><b>Merge fields:</b> ${esc(t.variables.map(v=>'{{'+v+'}}').join(', ')||'—')}</div>
   <div class="meta"><b>AdStudio:</b> offer <code>${esc(t.offer_id)}</code> · goal <code>${esc(t.goal)}</code> · template <code>${esc(t.adstudio_template_id||'-')}</code></div>
   <details><summary>Image direction — ${esc(br.name||t.image_brief)}</summary>
     <div class="brief"><b>${esc(br.concept||'')}</b><br>${esc(br.layout||'')}<br><i>Imagery:</i> ${esc(br.imagery||'')}<br><i>Palette:</i> ${esc(br.palette||'')}<br><i>On-image text:</i> ${esc(br.text_rules||'')}<br><i>Crops:</i> ${esc((br.formats||[]).join(', '))}</div></details>
   <details><summary>Why it's a winner · score ${t.evidence_score}</summary><div class="meta" style="margin-top:5px">${esc(t.winner_basis)}</div></details>
  </div>`;
}

function renderWin(){
  const q=(document.getElementById('wq').value||'').toLowerCase();
  const fc=w_cat.value,ff=w_fmt.value,fa=w_active.value,fd=+w_days.value;
  const rows=DATA.winners.filter(w=>{
    if(fc&&w.cat!==fc)return 0; if(ff&&w.f!==ff)return 0; if(fa&&w.st!==fa)return 0; if(w.d<fd)return 0;
    if(q){const hay=((w.h||'')+(w.b||'')+(w.ag||'')+(w.cat||'')).toLowerCase();if(!hay.includes(q))return 0}
    return 1;}).sort((a,b)=>b.s-a.s);
  document.getElementById('wcnt').textContent=rows.length+' ads';
  document.getElementById('wcards').innerHTML = rows.length?rows.map(winCard).join(''):'<div class="empty">No ads match.</div>';
}
function winCard(w){
  const tid=tmplById(w.cat);
  return `<div class="card">
   <div class="row"><span class="score ${sCls(w.s)}">${w.s}</span>
     <span class="tag cat">${esc(w.cat)}</span><span class="tag fmt">${esc(w.f)}</span>
     <span class="pill ${w.st==='active'?'on':''}">${esc(w.st)}</span></div>
   <h3 class="t">${esc(w.h||'(no headline)')}</h3>
   <div class="win"><div class="b">${esc(w.b)}</div></div>
   <div class="row"><span class="cta">${esc(w.cta||'—')}</span></div>
   <div class="meta"><b>${w.d}</b> days running · <b>${w.v}</b> creative versions · ${esc(w.ag||'')}</div>
   <div class="bars" title="longevity / iteration">
     <div class="bk ${w.d>=90?'f':''}"></div><div class="bk ${w.d>=180?'f':''}"></div><div class="bk ${w.d>=365?'f':''}"></div>
     <div class="bk ${w.v>=4?'f':''}"></div><div class="bk ${w.v>=7?'f':''}"></div></div>
   ${tid?`<div class="meta">&rarr; Template <span class="id">${tid}</span> in the library</div>`:''}
  </div>`;
}

async function refresh(){
  const btn=document.getElementById('refresh');
  if(!(window.cowork&&window.cowork.callMcpTool)){document.getElementById('wsrc').textContent='Live refresh runs inside Cowork only. Showing the embedded snapshot.';return;}
  btn.disabled=true;btn.textContent='Querying live DB...';
  try{
    const r=await window.cowork.callMcpTool("mcp__cdeaf211-72f8-4179-b53d-469c2852f9f2__execute_sql",{project_id:PROJECT,query:WINNER_SQL});
    let txt=(r&&r.content&&r.content[0]&&r.content[0].text)||'';
    let arr=null, payload=r&&r.structuredContent;
    if(payload&&Array.isArray(payload.result))arr=payload.result;
    if(!arr){const m=txt.match(/\[[\s\S]*\]/);if(m)arr=JSON.parse(m[0]);}
    let rows = Array.isArray(arr)&&arr.length&&arr[0]&&arr[0].json_agg?arr[0].json_agg:arr;
    if(!Array.isArray(rows))throw new Error('shape');
    const TY={market_update:'Market Update / Report',appraisal:'Home Value / Appraisal',property_management:'Property Management / Landlord',agency_brand:'Agency Brand / Agent Intro',listing:'Just Listed / New to Market',just_sold:'Just Sold / Social Proof',open_home:'Open Home / Inspection',auction:'Auction'};
    DATA.winners = rows.map(x=>({s:+x.s,d:+x.d,v:+x.v,st:x.st,t:x.t,f:x.f,ag:x.ag,h:x.h,b:x.b,cta:x.cta,cat:TY[x.t]||'Agency Brand / Agent Intro'}));
    document.getElementById('wsrc').textContent='Live from research.observed_ads - '+DATA.winners.length+' ads - '+new Date().toLocaleString();
    renderWin();
  }catch(e){document.getElementById('wsrc').textContent='Live refresh unavailable ('+e.message+'). Showing embedded snapshot.';}
  btn.disabled=false;btn.textContent='Refresh from live DB';
}

document.getElementById('wsrc').textContent='Embedded snapshot of '+DATA.winners.length+' real winners. Click "Refresh from live DB" for the latest.';
setView('client');renderWin();
</script>
</body></html>
