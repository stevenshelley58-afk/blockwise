<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blockwise — Hero options</title>
<style>
  :root{
    --ink:#0f1115; --ink-soft:#3a3f4a; --muted:#6b7280;
    --line:#e7e8ec; --bg:#ffffff; --panel:#f6f7f9;
    --accent:#1f6feb; --accent-ink:#0b3d91;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--ink);background:#fafbfc;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px}
  .label{font:600 12px/1 -apple-system;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:48px 0 14px}

  /* shared bits */
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 13px/1 inherit;color:var(--ink-soft);background:#fff;border:1px solid var(--line);padding:7px 13px;border-radius:999px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(31,111,235,.15)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:600 15px/1 inherit;border:0;border-radius:11px;padding:0 20px;height:50px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn--ink{background:var(--ink);color:#fff}
  .trial{font:500 13.5px/1 inherit;color:var(--muted);margin-top:18px}
  .trial b{color:var(--ink-soft);font-weight:600}

  /* ============ OPTION A — centered, search-first ============ */
  .heroA{text-align:center;padding:64px 0 72px;background:#fff;border:1px solid var(--line);border-radius:24px;margin:6px 0 8px}
  .heroA h1{font:700 clamp(34px,5vw,56px)/1.06 inherit;letter-spacing:-.02em;margin:22px auto 16px;max-width:20ch;text-wrap:balance}
  .heroA .sub{font:400 19px/1.5 inherit;color:var(--ink-soft);max-width:46ch;margin:0 auto}
  .searchbar{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 8px 8px 16px;max-width:560px;margin:30px auto 0;box-shadow:0 8px 30px rgba(15,17,21,.06)}
  .searchbar svg{width:20px;height:20px;color:var(--muted);flex:0 0 auto}
  .searchbar input{flex:1;border:0;outline:0;font:400 16px/1 inherit;color:var(--ink);background:transparent}
  .proof{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;margin-top:40px;padding-top:28px;border-top:1px solid var(--line);max-width:680px;margin-left:auto;margin-right:auto}
  .proof div{font:400 13.5px/1.4 inherit;color:var(--muted)}
  .proof b{display:block;font:700 22px/1 inherit;color:var(--ink);margin-bottom:5px;letter-spacing:-.01em}

  /* property-ad thumbnail row */
  .adrow{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:760px;margin:46px auto 0}
  .adcard{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(15,17,21,.05);text-align:left}
  .adcard__img{position:relative;height:118px}
  .adcard__img--1{background:linear-gradient(135deg,#c7d2fe,#93a5e8)}
  .adcard__img--2{background:linear-gradient(135deg,#bfe3d0,#8fcaa6)}
  .adcard__img--3{background:linear-gradient(135deg,#fcd9b6,#f3b985)}
  .tag{position:absolute;top:10px;left:10px;font:600 11px/1 inherit;color:var(--ink);background:rgba(255,255,255,.92);padding:6px 9px;border-radius:7px}
  .adcard figcaption{padding:11px 13px 13px}
  .adcard figcaption b{display:block;font:600 13.5px/1.2 inherit;color:var(--ink)}
  .adcard figcaption span{font:500 11.5px/1 inherit;color:var(--muted);display:block;margin-top:4px}
  .adrow__note{text-align:center;font:500 13px/1 inherit;color:var(--muted);margin-top:20px}
  @media(max-width:620px){.adrow{grid-template-columns:1fr;max-width:340px}}

  /* ============ OPTION B — restrained split, one live card ============ */
  .heroB{display:grid;grid-template-columns:1.05fr .95fr;gap:54px;align-items:center;padding:60px 0;background:#fff;border:1px solid var(--line);border-radius:24px;margin:6px 0 60px}
  .heroB .pad{padding-left:8px}
  .heroB h1{font:700 clamp(34px,5vw,52px)/1.05 inherit;letter-spacing:-.02em;margin:20px 0 16px}
  .heroB .sub{font:400 18px/1.55 inherit;color:var(--ink-soft);max-width:42ch}
  .searchbar--left{margin:26px 0 0}
  .livecard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 18px 50px rgba(15,17,21,.07)}
  .livecard__top{display:flex;align-items:center;justify-content:space-between;font:600 13px/1 inherit;color:var(--ink-soft)}
  .live{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 inherit;color:#1a7f4b}
  .live i{width:7px;height:7px;border-radius:50%;background:#23a35e;box-shadow:0 0 0 4px rgba(35,163,94,.16)}
  .livecard__market{font:500 14px/1 inherit;color:var(--muted);margin:18px 0 6px}
  .livecard__num{display:flex;align-items:baseline;gap:9px}
  .livecard__num strong{font:700 44px/1 inherit;letter-spacing:-.02em}
  .livecard__num span{font:500 14px/1 inherit;color:var(--muted)}
  .livecard ul{list-style:none;margin:20px 0 0;border-top:1px solid var(--line)}
  .livecard li{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font:500 14px/1 inherit;color:var(--ink-soft)}
  .livecard li b{font-weight:700;color:var(--ink)}

  @media(max-width:760px){.heroB{grid-template-columns:1fr;gap:34px}.heroB .pad{padding:0}}
</style>
</head>
<body>

<div class="wrap">

  <section class="heroA">
    <span class="eyebrow"><span class="dot"></span> Meta ads for real estate agents</span>
    <h1>See every ad running in your suburb.</h1>
    <p class="sub">Ads built from what's actually working in your area. Start getting leads today.</p>

    <form class="searchbar" onsubmit="return false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input type="text" placeholder="Enter your suburb or postcode" />
      <button class="btn btn--ink" type="submit">Show me the ads</button>
    </form>
    <p class="trial">7-day trial · 10 ad packs · <b>No card required</b></p>

    <div class="adrow" aria-label="Example real estate ads found nearby">
      <figure class="adcard">
        <div class="adcard__img adcard__img--1"><span class="tag">Just Listed</span></div>
        <figcaption><b>Ray White Mount Lawley</b><span>Sponsored · Facebook</span></figcaption>
      </figure>
      <figure class="adcard">
        <div class="adcard__img adcard__img--2"><span class="tag">Open Home</span></div>
        <figcaption><b>Acton Cottesloe</b><span>Sponsored · Instagram</span></figcaption>
      </figure>
      <figure class="adcard">
        <div class="adcard__img adcard__img--3"><span class="tag">Free Appraisal</span></div>
        <figcaption><b>The Agency Subiaco</b><span>Sponsored · Facebook</span></figcaption>
      </figure>
    </div>
    <p class="adrow__note">1,284 live agent ads tracked across Perth this week</p>
  </section>


</div>
</body>
</html>
