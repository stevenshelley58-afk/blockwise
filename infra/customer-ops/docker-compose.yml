name: blockwise-customer-ops

# Customer operations is a separate Compose project.  It must not share the
# product or Hermes networks, databases, volumes, or migration allowlists.
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: customer_ops_owner
      POSTGRES_DB: customer_ops
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets:
      - postgres_owner_password
      - chatwoot_db_password
      - snagtime_db_password
    volumes:
      - customer_ops_postgres:/var/lib/postgresql/18/docker
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_ops_owner -d customer_ops"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }

  mariadb:
    image: mariadb:11.4.5@sha256:49117dcc565cf51aa57ac5fca59ab31213402ff0eae6ffc13c46a37b938f7e4b
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mautic_db_root_password
      MARIADB_DATABASE: mautic
      MARIADB_USER: mautic
      MARIADB_PASSWORD_FILE: /run/secrets/mautic_db_password
    secrets: [mautic_db_root_password, mautic_db_password]
    volumes:
      - customer_ops_mariadb:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    deploy:
      resources:
        limits: { cpus: "2", memory: 1G }

  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--loglevel", "warning"]
    volumes: [customer_ops_redis:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  stalwart:
    image: stalwartlabs/stalwart:v0.16@sha256:74ca4f7f6885fe302f38a99381f36a208547afce1033d8734d9e6d8d3eba7446
    entrypoint: ["/customer-ops/stalwart-entrypoint.sh"]
    environment:
      STALWART_HOSTNAME: ${MAIL_HOST:?set MAIL_HOST}
      STALWART_PUBLIC_URL: https://${MAIL_HOST:?set MAIL_HOST}
    secrets: [stalwart_recovery_admin]
    volumes:
      - customer_ops_stalwart_etc:/etc/stalwart
      - customer_ops_stalwart_data:/var/lib/stalwart
      - ./stalwart-entrypoint.sh:/customer-ops/stalwart-entrypoint.sh:ro
    networks: [edge, backend, egress]
    ports:
      - "${STALWART_SMTP_BIND:-0.0.0.0}:${STALWART_SMTP_PORT:-25}:25"
      - "${STALWART_SUBMISSION_BIND:-0.0.0.0}:${STALWART_SUBMISSION_PORT:-587}:587"
      - "${STALWART_SMTPS_BIND:-0.0.0.0}:${STALWART_SMTPS_PORT:-465}:465"
      - "${STALWART_IMAPS_BIND:-0.0.0.0}:${STALWART_IMAPS_PORT:-993}:993"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1", memory: 768M }

  mautic:
    image: mautic/mautic:5.2-apache@sha256:e3fb45f69bf1a03effdf7d7cf214b269b82dd340acda328cf3cfb709971ada59
    entrypoint: ["/customer-ops/mautic-entrypoint.sh"]
    environment:
      MAUTIC_DB_HOST: mariadb
      MAUTIC_DB_PORT: "3306"
      MAUTIC_DB_NAME: mautic
      MAUTIC_DB_DATABASE: mautic
      MAUTIC_DB_USER: mautic
      MAUTIC_DB_PASSWORD_FILE: /run/secrets/mautic_db_password
      DOCKER_MAUTIC_ROLE: mautic_web
      MAUTIC_RUN_CRON_JOBS: "false"
    secrets: [mautic_db_password]
    volumes:
      - customer_ops_mautic_config:/var/www/html/config
      - customer_ops_mautic_media_files:/var/www/html/docroot/media/files
      - customer_ops_mautic_media_images:/var/www/html/docroot/media/images
      - customer_ops_mautic_logs:/var/www/html/var/logs
      - ./mautic-entrypoint.sh:/customer-ops/mautic-entrypoint.sh:ro
    networks: [edge, backend, egress]
    depends_on:
      mariadb: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$c=@file_get_contents(\"http://127.0.0.1\"); exit($$c===false?1:0);'"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /run/apache2]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }

  mautic-cron:
    image: mautic/mautic:5.2-apache@sha256:e3fb45f69bf1a03effdf7d7cf214b269b82dd340acda328cf3cfb709971ada59
    entrypoint: ["/customer-ops/mautic-entrypoint.sh"]
    environment:
      MAUTIC_DB_HOST: mariadb
      MAUTIC_DB_PORT: "3306"
      MAUTIC_DB_NAME: mautic
      MAUTIC_DB_DATABASE: mautic
      MAUTIC_DB_USER: mautic
      MAUTIC_DB_PASSWORD_FILE: /run/secrets/mautic_db_password
      DOCKER_MAUTIC_ROLE: mautic_cron
    secrets: [mautic_db_password]
    volumes:
      - customer_ops_mautic_config:/var/www/html/config
      - customer_ops_mautic_media_files:/var/www/html/docroot/media/files
      - customer_ops_mautic_media_images:/var/www/html/docroot/media/images
      - customer_ops_mautic_logs:/var/www/html/var/logs
      - ./mautic-entrypoint.sh:/customer-ops/mautic-entrypoint.sh:ro
    networks: [backend, egress]
    depends_on:
      mariadb: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  mautic-worker:
    image: mautic/mautic:5.2-apache@sha256:e3fb45f69bf1a03effdf7d7cf214b269b82dd340acda328cf3cfb709971ada59
    entrypoint: ["/customer-ops/mautic-entrypoint.sh"]
    environment:
      MAUTIC_DB_HOST: mariadb
      MAUTIC_DB_PORT: "3306"
      MAUTIC_DB_NAME: mautic
      MAUTIC_DB_DATABASE: mautic
      MAUTIC_DB_USER: mautic
      MAUTIC_DB_PASSWORD_FILE: /run/secrets/mautic_db_password
      DOCKER_MAUTIC_ROLE: mautic_worker
    secrets: [mautic_db_password]
    volumes:
      - customer_ops_mautic_config:/var/www/html/config
      - customer_ops_mautic_media_files:/var/www/html/docroot/media/files
      - customer_ops_mautic_media_images:/var/www/html/docroot/media/images
      - customer_ops_mautic_logs:/var/www/html/var/logs
      - ./mautic-entrypoint.sh:/customer-ops/mautic-entrypoint.sh:ro
    networks: [backend, egress]
    depends_on:
      mariadb: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  chatwoot-prepare:
    image: chatwoot/chatwoot:v4.14.2-ce@sha256:7d97dd1b1a610448b36f4e9d1f3ab801dd929fa9a774738f1eb5bbfdf6063c63
    entrypoint: ["/customer-ops/chatwoot-entrypoint.sh"]
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    environment: &chatwoot_prepare_env
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE_FILE: /run/secrets/chatwoot_secret_key_base
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD_FILE: /run/secrets/chatwoot_db_password
      REDIS_URL: redis://redis:6379/0
    secrets: [chatwoot_secret_key_base, chatwoot_db_password]
    volumes:
      - customer_ops_chatwoot_storage:/app/storage
      - customer_ops_chatwoot_tmp:/app/tmp
      - ./chatwoot-entrypoint.sh:/customer-ops/chatwoot-entrypoint.sh:ro
    networks: [backend, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  chatwoot-web:
    image: chatwoot/chatwoot:v4.14.2-ce@sha256:7d97dd1b1a610448b36f4e9d1f3ab801dd929fa9a774738f1eb5bbfdf6063c63
    entrypoint: ["/customer-ops/chatwoot-entrypoint.sh"]
    command: ["bundle", "exec", "rails", "s", "-b", "0.0.0.0", "-p", "3000"]
    environment: &chatwoot_env
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE_FILE: /run/secrets/chatwoot_secret_key_base
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD_FILE: /run/secrets/chatwoot_db_password
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${CHATWOOT_HOST:?set CHATWOOT_HOST}
      ACTIVE_STORAGE_SERVICE: local
      RAILS_LOG_TO_STDOUT: "true"
    secrets: [chatwoot_secret_key_base, chatwoot_db_password]
    volumes:
      - customer_ops_chatwoot_storage:/app/storage
      - customer_ops_chatwoot_tmp:/app/tmp
      - ./chatwoot-entrypoint.sh:/customer-ops/chatwoot-entrypoint.sh:ro
    networks: [edge, backend, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      chatwoot-prepare: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "u=URI('http://127.0.0.1:3000/api'); r=Net::HTTP.get_response(u); exit(r.code.to_i >= 500 ? 1 : 0)"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }

  chatwoot-worker:
    image: chatwoot/chatwoot:v4.14.2-ce@sha256:7d97dd1b1a610448b36f4e9d1f3ab801dd929fa9a774738f1eb5bbfdf6063c63
    entrypoint: ["/customer-ops/chatwoot-entrypoint.sh"]
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment: *chatwoot_env
    secrets: [chatwoot_secret_key_base, chatwoot_db_password]
    volumes:
      - customer_ops_chatwoot_storage:/app/storage
      - customer_ops_chatwoot_tmp:/app/tmp
      - ./chatwoot-entrypoint.sh:/customer-ops/chatwoot-entrypoint.sh:ro
    networks: [backend, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      chatwoot-prepare: { condition: service_completed_successfully }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }

  snagtime-web:
    # Build/publish this image from the merged SnagTime main SHA documented in
    # docs/runbooks/customer-ops-vps.md; this variable is intentionally an
    # operator-supplied immutable image contract, not a fake implementation.
    image: ${SNAGTIME_IMAGE:?set SNAGTIME_IMAGE to the immutable merged-main runtime image}
    command: ["node", "apps/web/server.js"]
    environment: &snagtime_env
      NODE_ENV: production
      DATABASE_PROVIDER: postgresql
      DATABASE_ROLE: app
      DATABASE_URL_FILE: /run/secrets/snagtime_database_url
      BUILD_ID: ${SNAGTIME_REVISION:?set SNAGTIME_REVISION to the full merged-main SHA}
      NEXT_PUBLIC_APP_URL: https://${SNAGTIME_HOST:?set SNAGTIME_HOST}
      FREE_ONLY: "true"
      NEXT_PUBLIC_FREE_ONLY: "true"
      CALENDAR_PROVIDER: google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      EMAIL_PROVIDER: smtp
      SMTP_HOST: ${MAIL_HOST:?set MAIL_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:?set EMAIL_REPLY_TO}
      EMAIL_SENDER_DOMAIN: ${EMAIL_SENDER_DOMAIN:?set EMAIL_SENDER_DOMAIN}
      AUTH_SECRET_FILE: /run/secrets/snagtime_auth_secret
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/snagtime_token_encryption_key
    secrets: [snagtime_database_url, google_client_secret, smtp_password, snagtime_auth_secret, snagtime_token_encryption_key]
    networks: [edge, backend, egress]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1", memory: 768M }

  snagtime-worker:
    image: ${SNAGTIME_IMAGE:?set SNAGTIME_IMAGE to the immutable merged-main runtime image}
    command: ["node", "dist/worker.mjs"]
    environment: *snagtime_env
    secrets: [snagtime_database_url, google_client_secret, smtp_password, snagtime_auth_secret, snagtime_token_encryption_key]
    networks: [backend, egress]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1", memory: 768M }

  blockwise-outbox-contract:
    image: ${BLOCKWISE_OUTBOX_IMAGE:-ghcr.io/stevenshelley58-afk/blockwise-outbox-adapter:contract-placeholder}
    profiles: [contract-placeholders]
    command: ["sh", "-c", "echo 'contract placeholder: Blockwise outbox worker is not implemented in this stack' >&2; exit 78"]
    networks: [backend]
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  hermes-adapter-contract:
    image: ${HERMES_ADAPTER_IMAGE:-ghcr.io/stevenshelley58-afk/hermes-adapter:contract-placeholder}
    profiles: [contract-placeholders]
    command: ["sh", "-c", "echo 'contract placeholder: Hermes adapter is not implemented in this stack' >&2; exit 78"]
    networks: [backend]
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  edge:
    name: blockwise-customer-ops-edge
  backend:
    name: blockwise-customer-ops-backend
    internal: true
  egress:
    name: blockwise-customer-ops-egress

volumes:
  customer_ops_postgres: {}
  customer_ops_mariadb: {}
  customer_ops_redis: {}
  customer_ops_stalwart_etc: {}
  customer_ops_stalwart_data: {}
  customer_ops_mautic_config: {}
  customer_ops_mautic_media_files: {}
  customer_ops_mautic_media_images: {}
  customer_ops_mautic_logs: {}
  customer_ops_chatwoot_storage: {}
  customer_ops_chatwoot_tmp: {}

secrets:
  postgres_owner_password: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/postgres_owner_password" }
  chatwoot_db_password: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/chatwoot_db_password" }
  snagtime_db_password: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/snagtime_db_password" }
  mautic_db_root_password: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/mautic_db_root_password" }
  mautic_db_password: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/mautic_db_password" }
  chatwoot_secret_key_base: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/chatwoot_secret_key_base" }
  snagtime_database_url: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/snagtime_database_url" }
  google_client_secret: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/google_client_secret" }
  smtp_password: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/smtp_password" }
  snagtime_auth_secret: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/snagtime_auth_secret" }
  snagtime_token_encryption_key: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/snagtime_token_encryption_key" }
  stalwart_recovery_admin: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/stalwart_recovery_admin" }
