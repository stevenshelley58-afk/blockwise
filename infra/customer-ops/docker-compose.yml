name: blockwise-customer-ops

# Customer operations is a separate Compose project. It shares only the
# narrowly scoped external mail network with product-mail; it does not share
# product/Hermes backends, databases, volumes, or migration allowlists.
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: customer_ops_owner
      POSTGRES_DB: customer_ops
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets:
      - postgres_owner_password
      - chatwoot_db_password
      - snagtime_db_password
    volumes:
      - customer_ops_postgres:/var/lib/postgresql/18/docker
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_ops_owner -d customer_ops"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }

  mariadb:
    image: mariadb:11.4@sha256:611a2fcc5fa7c6ceb8644c6f74b25ede004ff6c3a6b38c8f8c23d3bbf6c26430
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mautic_db_root_password
      MARIADB_DATABASE: mautic
      MARIADB_USER: mautic
      MARIADB_PASSWORD_FILE: /run/secrets/mautic_db_password
    secrets: [mautic_db_root_password, mautic_db_password]
    volumes:
      - customer_ops_mariadb:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    deploy:
      resources:
        limits: { cpus: "2", memory: 1G }

  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--loglevel", "warning"]
    volumes: [customer_ops_redis:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  mautic:
    image: mautic/mautic:7.2.0-apache@sha256:dea3bb71a5c5bf4c0c7d1764e58a32109898e7b2e6a710f14f50e2a913c03a0f
    entrypoint: ["/customer-ops/mautic-entrypoint.sh"]
    environment:
      MAUTIC_DB_HOST: mariadb
      MAUTIC_DB_PORT: "3306"
      MAUTIC_DB_NAME: mautic
      MAUTIC_DB_DATABASE: mautic
      MAUTIC_DB_USER: mautic
      DOCKER_MAUTIC_ROLE: mautic_web
      MAUTIC_RUN_CRON_JOBS: "false"
      MAUTIC_MAILER_FROM_EMAIL: ${MAUTIC_EMAIL_FROM:?set MAUTIC_EMAIL_FROM}
      SMTP_USER: ${MAUTIC_SMTP_USER:?set MAUTIC_SMTP_USER}
      SMTP_HOST: ${MAIL_PUBLIC_HOST:?set MAIL_PUBLIC_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
    secrets: [mautic_db_password, mautic_smtp_password]
    volumes:
      - customer_ops_mautic_config:/var/www/html/config
      - customer_ops_mautic_media_files:/var/www/html/docroot/media/files
      - customer_ops_mautic_media_images:/var/www/html/docroot/media/images
      - customer_ops_mautic_logs:/var/www/html/var/logs
      - customer_ops_mautic_var:/var/www/html/var
      - ./mautic-entrypoint.sh:/customer-ops/mautic-entrypoint.sh:ro
    networks: [edge, backend, egress, mail]
    depends_on:
      mariadb: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$c=@file_get_contents(\"http://127.0.0.1\"); exit($$c===false?1:0);'"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /run/apache2]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }

  mautic-cron:
    image: mautic/mautic:7.2.0-apache@sha256:dea3bb71a5c5bf4c0c7d1764e58a32109898e7b2e6a710f14f50e2a913c03a0f
    entrypoint: ["/customer-ops/mautic-entrypoint.sh"]
    environment:
      MAUTIC_DB_HOST: mariadb
      MAUTIC_DB_PORT: "3306"
      MAUTIC_DB_NAME: mautic
      MAUTIC_DB_DATABASE: mautic
      MAUTIC_DB_USER: mautic
      DOCKER_MAUTIC_ROLE: mautic_cron
      MAUTIC_MAILER_FROM_EMAIL: ${MAUTIC_EMAIL_FROM:?set MAUTIC_EMAIL_FROM}
      SMTP_USER: ${MAUTIC_SMTP_USER:?set MAUTIC_SMTP_USER}
      SMTP_HOST: ${MAIL_PUBLIC_HOST:?set MAIL_PUBLIC_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
    secrets: [mautic_db_password, mautic_smtp_password]
    volumes:
      - customer_ops_mautic_config:/var/www/html/config
      - customer_ops_mautic_media_files:/var/www/html/docroot/media/files
      - customer_ops_mautic_media_images:/var/www/html/docroot/media/images
      - customer_ops_mautic_logs:/var/www/html/var/logs
      - customer_ops_mautic_var:/var/www/html/var
      - ./mautic-entrypoint.sh:/customer-ops/mautic-entrypoint.sh:ro
    networks: [backend, egress, mail]
    depends_on:
      mariadb: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "find /var/www/html/var/logs -type f -mmin -15 -print -quit | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  mautic-worker:
    image: mautic/mautic:7.2.0-apache@sha256:dea3bb71a5c5bf4c0c7d1764e58a32109898e7b2e6a710f14f50e2a913c03a0f
    entrypoint: ["/customer-ops/mautic-entrypoint.sh"]
    environment:
      MAUTIC_DB_HOST: mariadb
      MAUTIC_DB_PORT: "3306"
      MAUTIC_DB_NAME: mautic
      MAUTIC_DB_DATABASE: mautic
      MAUTIC_DB_USER: mautic
      DOCKER_MAUTIC_ROLE: mautic_worker
      MAUTIC_MAILER_FROM_EMAIL: ${MAUTIC_EMAIL_FROM:?set MAUTIC_EMAIL_FROM}
      SMTP_USER: ${MAUTIC_SMTP_USER:?set MAUTIC_SMTP_USER}
      SMTP_HOST: ${MAIL_PUBLIC_HOST:?set MAIL_PUBLIC_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
    secrets: [mautic_db_password, mautic_smtp_password]
    volumes:
      - customer_ops_mautic_config:/var/www/html/config
      - customer_ops_mautic_media_files:/var/www/html/docroot/media/files
      - customer_ops_mautic_media_images:/var/www/html/docroot/media/images
      - customer_ops_mautic_logs:/var/www/html/var/logs
      - customer_ops_mautic_var:/var/www/html/var
      - ./mautic-entrypoint.sh:/customer-ops/mautic-entrypoint.sh:ro
    networks: [backend, egress, mail]
    depends_on:
      mariadb: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "find /var/www/html/var/logs -type f -mmin -15 -print -quit | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  chatwoot-prepare:
    image: chatwoot/chatwoot:v4.17.1-ce@sha256:351465db8f96c591686b4667a63836f048aa1d7c86c6ea97d262d5f37c795030
    entrypoint: ["/customer-ops/chatwoot-entrypoint.sh"]
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    environment: &chatwoot_prepare_env
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE_FILE: /run/secrets/chatwoot_secret_key_base
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD_FILE: /run/secrets/chatwoot_db_password
      REDIS_URL: redis://redis:6379/0
      SMTP_ADDRESS: ${MAIL_PUBLIC_HOST:?set MAIL_PUBLIC_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${CHATWOOT_SMTP_USER:?set CHATWOOT_SMTP_USER}
      SMTP_PASSWORD_FILE: /run/secrets/chatwoot_smtp_password
      SMTP_ENABLE_STARTTLS_AUTO: "true"
      MAILER_SENDER_EMAIL: ${CHATWOOT_EMAIL_FROM:?set CHATWOOT_EMAIL_FROM}
    secrets: [chatwoot_secret_key_base, chatwoot_db_password, chatwoot_smtp_password]
    volumes:
      - customer_ops_chatwoot_storage:/app/storage
      - customer_ops_chatwoot_tmp:/app/tmp
      - ./chatwoot-entrypoint.sh:/customer-ops/chatwoot-entrypoint.sh:ro
    networks: [backend, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  chatwoot-web:
    image: chatwoot/chatwoot:v4.17.1-ce@sha256:351465db8f96c591686b4667a63836f048aa1d7c86c6ea97d262d5f37c795030
    entrypoint: ["/customer-ops/chatwoot-entrypoint.sh"]
    command: ["bundle", "exec", "rails", "s", "-b", "0.0.0.0", "-p", "3000"]
    environment: &chatwoot_env
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE_FILE: /run/secrets/chatwoot_secret_key_base
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD_FILE: /run/secrets/chatwoot_db_password
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${CHATWOOT_HOST:?set CHATWOOT_HOST}
      ACTIVE_STORAGE_SERVICE: local
      RAILS_LOG_TO_STDOUT: "true"
      SMTP_ADDRESS: ${MAIL_PUBLIC_HOST:?set MAIL_PUBLIC_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${CHATWOOT_SMTP_USER:?set CHATWOOT_SMTP_USER}
      SMTP_PASSWORD_FILE: /run/secrets/chatwoot_smtp_password
      SMTP_ENABLE_STARTTLS_AUTO: "true"
      MAILER_SENDER_EMAIL: ${CHATWOOT_EMAIL_FROM:?set CHATWOOT_EMAIL_FROM}
    secrets: [chatwoot_secret_key_base, chatwoot_db_password, chatwoot_smtp_password, chatwoot_inbox_password]
    volumes:
      - customer_ops_chatwoot_storage:/app/storage
      - customer_ops_chatwoot_tmp:/app/tmp
      - ./chatwoot-entrypoint.sh:/customer-ops/chatwoot-entrypoint.sh:ro
    networks: [edge, backend, egress, mail]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      chatwoot-prepare: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "u=URI('http://127.0.0.1:3000/api'); r=Net::HTTP.get_response(u); exit(r.code.to_i >= 500 ? 1 : 0)"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }

  chatwoot-worker:
    image: chatwoot/chatwoot:v4.17.1-ce@sha256:351465db8f96c591686b4667a63836f048aa1d7c86c6ea97d262d5f37c795030
    entrypoint: ["/customer-ops/chatwoot-entrypoint.sh"]
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment: *chatwoot_env
    secrets: [chatwoot_secret_key_base, chatwoot_db_password, chatwoot_smtp_password]
    volumes:
      - customer_ops_chatwoot_storage:/app/storage
      - customer_ops_chatwoot_tmp:/app/tmp
      - ./chatwoot-entrypoint.sh:/customer-ops/chatwoot-entrypoint.sh:ro
    networks: [backend, egress, mail]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      chatwoot-prepare: { condition: service_completed_successfully }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }

  snagtime-web:
    # Build/publish this image from the merged SnagTime main SHA documented in
    # docs/runbooks/customer-ops-vps.md. The operator must supply the published
    # immutable digest; this stack never pretends to package SnagTime.
    image: ${SNAGTIME_IMAGE:?set SNAGTIME_IMAGE to the immutable merged-main runtime image}
    command: ["node", "apps/web/server.js"]
    environment: &snagtime_env
      NODE_ENV: production
      DATABASE_PROVIDER: postgresql
      DATABASE_ROLE: app
      DATABASE_URL_FILE: /run/secrets/snagtime_database_url
      BUILD_ID: ${SNAGTIME_REVISION:?set SNAGTIME_REVISION to the full merged-main SHA}
      NEXT_PUBLIC_APP_URL: https://${SNAGTIME_HOST:?set SNAGTIME_HOST}
      FREE_ONLY: "true"
      NEXT_PUBLIC_FREE_ONLY: "true"
      CALENDAR_PROVIDER: google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      EMAIL_PROVIDER: smtp
      SMTP_HOST: ${MAIL_PUBLIC_HOST:?set MAIL_PUBLIC_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_USER: ${SNAGTIME_SMTP_USER:?set SNAGTIME_SMTP_USER}
      SMTP_PASSWORD_FILE: /run/secrets/snagtime_smtp_password
      EMAIL_FROM: ${SNAGTIME_EMAIL_FROM:?set SNAGTIME_EMAIL_FROM}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:?set EMAIL_REPLY_TO}
      EMAIL_SENDER_DOMAIN: ${EMAIL_SENDER_DOMAIN:?set EMAIL_SENDER_DOMAIN}
      AUTH_SECRET_FILE: /run/secrets/snagtime_auth_secret
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/snagtime_token_encryption_key
    secrets: [snagtime_database_url, google_client_secret, snagtime_smtp_password, snagtime_auth_secret, snagtime_token_encryption_key]
    networks: [edge, backend, egress, mail]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1", memory: 768M }

  snagtime-worker:
    image: ${SNAGTIME_IMAGE:?set SNAGTIME_IMAGE to the immutable merged-main runtime image}
    command: ["node", "dist/worker.mjs"]
    environment:
      <<: *snagtime_env
      SNAGTIME_WORKER_HEARTBEAT_FILE: /run/customer-ops/snagtime-worker-heartbeat
    secrets: [snagtime_database_url, google_client_secret, snagtime_smtp_password, snagtime_auth_secret, snagtime_token_encryption_key]
    networks: [backend, egress, mail]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    # The published worker must touch this file after each completed queue
    # cycle. A stale/missing heartbeat fails closed rather than reporting a
    # live process whose queue is wedged.
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/customer-ops/snagtime-worker-heartbeat && find /run/customer-ops/snagtime-worker-heartbeat -mmin -5 -print -quit | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10m
    tmpfs: [/tmp, /run/customer-ops]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1", memory: 768M }

  smtp-client:
    # Built only for acceptance checks; it has no persistent state and no
    # ingress. The Dockerfile pins its Alpine base by digest.
    build:
      context: ./smtp-client
      dockerfile: Dockerfile
    profiles: [smoke]
    entrypoint: ["swaks"]
    networks: [mail]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

networks:
  edge:
    name: blockwise-customer-ops-edge
  backend:
    name: blockwise-customer-ops-backend
    internal: true
  egress:
    name: blockwise-customer-ops-egress
  mail:
    name: blockwise-customer-ops-mail
    external: true

volumes:
  customer_ops_postgres: {}
  customer_ops_mariadb: {}
  customer_ops_redis: {}
  customer_ops_mautic_config: {}
  customer_ops_mautic_media_files: {}
  customer_ops_mautic_media_images: {}
  customer_ops_mautic_logs: {}
  customer_ops_mautic_var: {}
  customer_ops_chatwoot_storage: {}
  customer_ops_chatwoot_tmp: {}

secrets:
  postgres_owner_password: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/postgres_owner_password" }
  chatwoot_db_password: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/chatwoot_db_password" }
  snagtime_db_password: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/snagtime_db_password" }
  mautic_db_root_password: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/mautic_db_root_password" }
  mautic_db_password: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/mautic_db_password" }
  chatwoot_secret_key_base: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/chatwoot_secret_key_base" }
  snagtime_database_url: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/snagtime_database_url" }
  google_client_secret: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/google_client_secret" }
  mautic_smtp_password: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/mautic_smtp_password" }
  chatwoot_smtp_password: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/chatwoot_smtp_password" }
  snagtime_smtp_password: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/snagtime_smtp_password" }
  chatwoot_inbox_password: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/chatwoot_inbox_password" }
  snagtime_auth_secret: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/snagtime_auth_secret" }
  snagtime_token_encryption_key: { file: "${CUSTOMER_OPS_SECRETS_DIR:-/etc/blockwise/customer-ops/secrets}/snagtime_token_encryption_key" }
