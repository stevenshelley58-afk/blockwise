services:
  adstudio-video-renderer:
    image: blockwise/adstudio-video-renderer:2026-08-31
    build:
      context: ../..
      dockerfile: video-worker/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      ADVIDEO_WORKER_NAME: ${ADVIDEO_WORKER_NAME:-adstudio-video-renderer}
      ADVIDEO_MAX_ATTEMPTS: ${ADVIDEO_MAX_ATTEMPTS:-3}
      ADVIDEO_POLL_MS: ${ADVIDEO_POLL_MS:-2000}
      ADVIDEO_OUTPUT_DIR: /tmp/blockwise-video-worker
      ADVIDEO_FFMPEG_PATH: /usr/bin/ffmpeg
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "video-worker/index.ts", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
