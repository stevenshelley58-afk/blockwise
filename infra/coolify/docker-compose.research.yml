version: "3.9"

x-blockwise-research-reset:
  owner: "hermes"
  status: "hard-reset-runtime"
  removed_active_services_count: 2
  notes:
    - "Legacy worker code is archived, not mounted into the active runtime."
    - "Hermes owns research execution; build and collection adapters are placeholders until enabled by the operator."
    - "Pinned images are required. Do not deploy with floating tags."

services:
  steel:
    image: "${STEEL_IMAGE:?Set STEEL_IMAGE to a pinned steel-browser tag or digest}"
    container_name: blockwise-steel
    restart: unless-stopped
    environment:
      SKIP_FINGERPRINT_INJECTION: ${STEEL_SKIP_FINGERPRINT_INJECTION:-true}
    expose: ["3000", "9223"]
    volumes:
      - steel-cache:/app/.cache
    networks: [research]
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  hermes:
    build:
      context: ../..
      dockerfile: infra/hermes/Dockerfile
      args:
        HERMES_BASE_IMAGE: "${HERMES_BASE_IMAGE:?Set HERMES_BASE_IMAGE to a pinned Hermes image tag or digest}"
    image: "${BLOCKWISE_HERMES_IMAGE:-blockwise/hermes-research:2026-06-02}"
    container_name: blockwise-hermes
    command: ["gateway", "run", "--replace", "--accept-hooks"]
    restart: unless-stopped
    depends_on:
      - steel
    ports:
      - "127.0.0.1:${HERMES_GATEWAY_HOST_PORT:-8642}:8642"
      - "127.0.0.1:${HERMES_DASHBOARD_HOST_PORT:-9119}:9119"
    environment:
      HERMES_CONFIG: /app/hermes.toml
      HERMES_HOME: /opt/data
      HERMES_ACCEPT_HOOKS: "1"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?Set HERMES_API_SERVER_KEY}
      API_SERVER_CORS_ORIGINS: ${HERMES_API_SERVER_CORS_ORIGINS:-https://hermes.blockwise.sale}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_INSECURE: ${HERMES_DASHBOARD_INSECURE:-1}
      HERMES_PROVIDER: ${HERMES_PROVIDER:-openrouter}
      HERMES_DEFAULT_MODEL: ${HERMES_DEFAULT_MODEL:?Set HERMES_DEFAULT_MODEL to an OpenRouter model slug}
      HERMES_ESCALATION_MODEL: ${HERMES_ESCALATION_MODEL:?Set HERMES_ESCALATION_MODEL to an OpenRouter model slug}
      HERMES_OPENROUTER_MODELS_JSON: "${HERMES_OPENROUTER_MODELS_JSON:-{}}"
      HERMES_CONTENT_MODELS_JSON: "${HERMES_CONTENT_MODELS_JSON:-{}}"
      HERMES_CONTENT_DRY_RUN: ${HERMES_CONTENT_DRY_RUN:-false}
      HERMES_RESEARCH_MODE: ${HERMES_RESEARCH_MODE:-maintain}
      HERMES_BUILD_CONCURRENCY: ${HERMES_BUILD_CONCURRENCY:-4}
      HERMES_MAINTAIN_CONCURRENCY: ${HERMES_MAINTAIN_CONCURRENCY:-1}
      HERMES_COLLECTION_INTERVAL_SECONDS: ${HERMES_COLLECTION_INTERVAL_SECONDS:-900}
      HERMES_DAILY_SPEND_LIMIT_USD: ${HERMES_DAILY_SPEND_LIMIT_USD:-25}
      HERMES_WEBHOOK_SECRET: ${HERMES_WEBHOOK_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      MEM0_API_KEY: ${MEM0_API_KEY}
      MEM0_PROJECT_ID: ${MEM0_PROJECT_ID:-blockwise-research}
      HERMES_REMOTE_BROWSER_CDP_URL: ${HERMES_REMOTE_BROWSER_CDP_URL:-http://blockwise-steel:9223}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      HERMES_SUPABASE_URL: ${SUPABASE_URL}
      HERMES_SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      HERMES_RESEARCH_AD_CREATIVES_BUCKET: ${HERMES_RESEARCH_AD_CREATIVES_BUCKET:-research-ad-creatives}
      HERMES_RESEARCH_SCREENSHOTS_BUCKET: ${HERMES_RESEARCH_SCREENSHOTS_BUCKET:-research-screenshots}
      HERMES_RESEARCH_RAW_EVIDENCE_BUCKET: ${HERMES_RESEARCH_RAW_EVIDENCE_BUCKET:-research-raw-evidence}
      BLOCKWISE_RESEARCH_RUNTIME_OWNER: hermes
      BLOCKWISE_RESEARCH_RUNTIME_ENABLED: ${BLOCKWISE_RESEARCH_RUNTIME_ENABLED:-true}
      HERMES_RESEARCH_TARGET_POSTCODES: ${HERMES_RESEARCH_TARGET_POSTCODES:-ALL}
      HERMES_RESEARCH_SUPERVISOR_POLICY_LIMIT: ${HERMES_RESEARCH_SUPERVISOR_POLICY_LIMIT:-50}
      HERMES_QUEUE_LOOP_INTERVAL_MS: ${HERMES_QUEUE_LOOP_INTERVAL_MS:-10000}
      HERMES_QUEUE_CLAIM_LIMIT: ${HERMES_QUEUE_CLAIM_LIMIT:-8}
      HERMES_QUEUE_MAX_JOBS_PER_TICK: ${HERMES_QUEUE_MAX_JOBS_PER_TICK:-8}
      HERMES_CENSUS_QUEUE_PRIORITY: ${HERMES_CENSUS_QUEUE_PRIORITY:-30}
      HERMES_CLASSIFICATION_BACKFILL_BATCH_SIZE: ${HERMES_CLASSIFICATION_BACKFILL_BATCH_SIZE:-200}
      HERMES_CLASSIFICATION_WEAK_BACKFILL_BATCH_SIZE: ${HERMES_CLASSIFICATION_WEAK_BACKFILL_BATCH_SIZE:-50}
      HERMES_RESEARCH_FETCH_TIMEOUT_MS: ${HERMES_RESEARCH_FETCH_TIMEOUT_MS:-8000}
      HERMES_META_CAPTURE_PROVIDER: ${HERMES_META_CAPTURE_PROVIDER:-hermes_browser}
      HERMES_META_BROWSER_TIMEOUT_MS: ${HERMES_META_BROWSER_TIMEOUT_MS:-30000}
      HERMES_META_BROWSER_EXECUTABLE: ${HERMES_META_BROWSER_EXECUTABLE:-chromium}
      HERMES_META_CAPTURE_TIMEOUT_MS: ${HERMES_META_CAPTURE_TIMEOUT_MS:-30000}
      HERMES_META_CAPTURE_RESULTS_LIMIT: ${HERMES_META_CAPTURE_RESULTS_LIMIT:-250}
      HERMES_AD_PAGE_REFRESH_BATCH_SIZE: ${HERMES_AD_PAGE_REFRESH_BATCH_SIZE:-40}
      HERMES_AD_PAGE_REFRESH_MAX_ACTIVE: ${HERMES_AD_PAGE_REFRESH_MAX_ACTIVE:-200}
      HERMES_LOCATION_AD_SEARCH_ENABLED: ${HERMES_LOCATION_AD_SEARCH_ENABLED:-true}
      HERMES_META_AD_LIBRARY_ACCESS_TOKEN: ${HERMES_META_AD_LIBRARY_ACCESS_TOKEN:-}
      META_AD_LIBRARY_ACCESS_TOKEN: ${META_AD_LIBRARY_ACCESS_TOKEN:-}
      META_AD_LIBRARY_TOKEN: ${META_AD_LIBRARY_TOKEN:-}
      HERMES_META_OFFICIAL_API_ENABLED: ${HERMES_META_OFFICIAL_API_ENABLED:-true}
      HERMES_META_OFFICIAL_API_VERSION: ${HERMES_META_OFFICIAL_API_VERSION:-v20.0}
      HERMES_META_OFFICIAL_AD_TYPE: ${HERMES_META_OFFICIAL_AD_TYPE:-HOUSING_ADS}
      HERMES_META_OFFICIAL_PAGE_LIMIT: ${HERMES_META_OFFICIAL_PAGE_LIMIT:-100}
      HERMES_META_OFFICIAL_MAX_PAGES_PER_CAPTURE: ${HERMES_META_OFFICIAL_MAX_PAGES_PER_CAPTURE:-25}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - hermes-data:/opt/data
    networks: [research]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/hermes/.venv/bin/python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  uptime-kuma:
    image: "${UPTIME_KUMA_IMAGE:-louislam/uptime-kuma:1.23.16}"
    container_name: blockwise-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-data:/app/data
    networks: [research]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  hermes-data:
  steel-cache:
  uptime-data:

networks:
  research:
    driver: bridge
