version: "3.9"

services:
  research-orchestrator:
    build:
      context: ../..
      dockerfile: workers/research-orchestrator/Dockerfile
    container_name: research-orchestrator
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AD_COLLECTOR_PROVIDER: ${AD_COLLECTOR_PROVIDER:-self_hosted_meta}
      SELF_HOSTED_META_COLLECTOR_URL: http://meta-ad-library-collector:9100
      SEARCHAPI_API_KEY: ${SEARCHAPI_API_KEY:-}
      SEARCHAPI_BASE_URL: ${SEARCHAPI_BASE_URL:-https://www.searchapi.io/api/v1/search}
      SEARCHAPI_ESTIMATED_COST_PER_RUN_USD: ${SEARCHAPI_ESTIMATED_COST_PER_RUN_USD:-0.004}
      META_AD_LIBRARY_API_TOKEN: ${META_AD_LIBRARY_API_TOKEN:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v20.0}
      AD_COLLECTOR_COUNTRY: AU
      AD_COLLECTOR_ACTIVE_STATUS: active
      AD_COLLECTOR_DAILY_SPEND_LIMIT_USD: ${AD_COLLECTOR_DAILY_SPEND_LIMIT_USD:-5}
      AD_COLLECTOR_RESULTS_LIMIT_PER_PAGE: "50"
      RESEARCH_RAW_EVIDENCE_BUCKET: research-raw-evidence
      RESEARCH_AD_CREATIVES_BUCKET: research-ad-creatives
      ORCHESTRATOR_MODE: loop
      ORCHESTRATOR_LOOP_INTERVAL_MS: ${ORCHESTRATOR_LOOP_INTERVAL_MS:-300000}
      ORCHESTRATOR_MAX_PAGES_PER_TICK: ${ORCHESTRATOR_MAX_PAGES_PER_TICK:-5}
      ORCHESTRATOR_DRY_RUN: "false"
    networks: [research]
    depends_on: [meta-ad-library-collector]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  meta-ad-library-collector:
    build:
      context: ../..
      dockerfile: workers/meta-ad-library-collector/Dockerfile
    container_name: meta-ad-library-collector
    restart: unless-stopped
    environment:
      META_COLLECTOR_PORT: "9100"
      META_COLLECTOR_TIMEOUT_MS: "45000"
      META_COLLECTOR_WAIT_MS: "9000"
      META_COLLECTOR_COOKIE_JSON: ${META_COLLECTOR_COOKIE_JSON:-}
      META_COLLECTOR_PROFILE_DIR: /data/profile
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../../workers/meta-ad-library-collector:/app:rw
      - collector-profile:/data
    ports:
      - "127.0.0.1:9100:9100"
    networks: [research]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  hermes:
    image: ghcr.io/nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      MEM0_API_KEY: ${MEM0_API_KEY}
      BROWSERBASE_API_KEY: ${BROWSERBASE_API_KEY}
      BROWSERBASE_PROJECT_ID: ${BROWSERBASE_PROJECT_ID}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SELF_HOSTED_META_COLLECTOR_URL: http://meta-ad-library-collector:9100
      META_AD_LIBRARY_COLLECTOR_URL: http://meta-ad-library-collector:9100
      AD_COLLECTOR_PROVIDER: ${AD_COLLECTOR_PROVIDER:-self_hosted_meta}
      SEARCHAPI_API_KEY: ${SEARCHAPI_API_KEY:-}
      META_AD_LIBRARY_API_TOKEN: ${META_AD_LIBRARY_API_TOKEN:-}
      AD_COLLECTOR_DAILY_SPEND_LIMIT_USD: ${AD_COLLECTOR_DAILY_SPEND_LIMIT_USD:-5}
      HERMES_WEBHOOK_SECRET: ${HERMES_WEBHOOK_SECRET}
      HERMES_PORT: "8080"
    volumes:
      - hermes-data:/data
      - ../../hermes/skills:/app/skills:rw
      - ../../workers/meta-ad-library-collector:/opt/blockwise/meta-ad-library-collector:rw
    networks: [research]
    depends_on: [meta-ad-library-collector]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-data:/app/data
    networks: [research]

volumes:
  hermes-data:
  collector-profile:
  uptime-data:

networks:
  research:
    driver: bridge
