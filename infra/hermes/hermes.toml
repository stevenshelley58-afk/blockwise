# Hermes runtime config for the Blockwise research engine.
# Overridden by env vars where applicable.

[agent]
name = "blockwise-research"
description = "Hermes agent running the Blockwise real-estate ad research engine"
home_dir = "/data"

[agent.server]
host = "0.0.0.0"
port = 8080

[agent.model]
# Default routes to OpenRouter; per-skill overrides in each SKILL.md if needed.
provider = "openrouter"
model = "anthropic/claude-sonnet-4"
# Cheaper model for high-volume classification skills:
classifier_model = "openai/gpt-4o-mini"

[agent.memory]
# Postgres (Supabase) is the system of record for decisions.
# mem0 is the fuzzy recall layer.
[agent.memory.mem0]
enabled = true

[agent.memory.postgres]
enabled = true
schema = "research"
table = "agent_decisions"

[agent.skills]
directory = "/app/skills"
auto_reload = true

[agent.skills.allowed]
# Whitelist — Hermes will not load other skills found on disk.
names = [
  "blockwise-agent-census",
  "blockwise-page-resolver",
  "blockwise-ad-collector",
  "blockwise-ad-classifier",
  "blockwise-coverage-auditor",
  "blockwise-defect-investigator",
  "blockwise-operator-chat",
]

[agent.tools.browserbase]
enabled = true

[agent.scheduling]
# Cron expressions in TZ Australia/Perth.
timezone = "Australia/Perth"

[[agent.scheduling.jobs]]
name = "weekly-census-priority-1"
skill = "blockwise-agent-census"
cron = "0 3 * * 1"            # 3am Monday Perth time
input = { state = "WA", priority_max = 1 }

[[agent.scheduling.jobs]]
name = "weekly-coverage-audit"
skill = "blockwise-coverage-auditor"
cron = "0 5 * * 1"            # 5am Monday Perth time
input = { method = "sampled_manual_browse", state = "WA" }
