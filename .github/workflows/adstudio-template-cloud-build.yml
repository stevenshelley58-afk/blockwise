name: Ad Studio Template Cloud Build

on:
  workflow_dispatch:
    inputs:
      candidate_ids:
        description: "Optional comma/space/newline list like meta_094,142. Leave blank to use start_index/count."
        required: false
        default: ""
      start_index:
        description: "First candidate number when candidate_ids is blank."
        required: false
        default: "1"
      count:
        description: "How many candidates to process in this cloud batch."
        required: false
        default: "10"
      output_branch:
        description: "Branch that receives the generated template batch."
        required: false
        default: "codex/adstudio-template-cloud-build"
      max_parallel:
        description: "Maximum isolated Codex template jobs to run at once."
        required: false
        default: "5"
      codex_model:
        description: "Codex model for isolated template workers and batch integrator."
        required: false
        default: "gpt-5.5"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: adstudio-template-cloud-build-${{ github.event.inputs.output_branch }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare template matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      candidate_count: ${{ steps.matrix.outputs.candidate_count }}
      output_branch: ${{ steps.matrix.outputs.output_branch }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
    steps:
      - name: Build candidate matrix
        id: matrix
        shell: bash
        env:
          CANDIDATE_IDS: ${{ github.event.inputs.candidate_ids }}
          START_INDEX: ${{ github.event.inputs.start_index }}
          COUNT: ${{ github.event.inputs.count }}
          OUTPUT_BRANCH: ${{ github.event.inputs.output_branch }}
          MAX_PARALLEL: ${{ github.event.inputs.max_parallel }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const total = 330;
          const rawIds = process.env.CANDIDATE_IDS || "";
          const start = Number.parseInt(process.env.START_INDEX || "1", 10);
          const count = Number.parseInt(process.env.COUNT || "10", 10);
          const maxParallel = Math.max(1, Math.min(20, Number.parseInt(process.env.MAX_PARALLEL || "5", 10) || 5));
          function normalise(value) {
            const digits = String(value).trim().replace(/^meta[_-]?/iu, "");
            if (!/^\d+$/u.test(digits)) throw new Error(`Invalid candidate id: ${value}`);
            const number = Number.parseInt(digits, 10);
            if (number < 1 || number > total) throw new Error(`Candidate ${value} is outside 1..${total}`);
            const padded = String(number).padStart(3, "0");
            return {
              candidate_id: `meta_${padded}`,
              candidate_number: number,
              module_path: `src/lib/adstudio/gold-templates/meta-${padded}.ts`,
            };
          }
          let candidates;
          if (rawIds.trim()) {
            candidates = rawIds.split(/[\s,]+/u).filter(Boolean).map(normalise);
          } else {
            if (!Number.isInteger(start) || !Number.isInteger(count) || start < 1 || count < 1) {
              throw new Error("start_index and count must be positive integers");
            }
            candidates = Array.from({ length: count }, (_, offset) => normalise(start + offset));
          }
          const seen = new Set();
          candidates = candidates.filter((candidate) => {
            if (seen.has(candidate.candidate_id)) return false;
            seen.add(candidate.candidate_id);
            return true;
          });
          if (candidates.length > 50) {
            throw new Error("Run template generation in batches of 50 or fewer isolated jobs.");
          }
          const outputBranch = (process.env.OUTPUT_BRANCH || "codex/adstudio-template-cloud-build").trim();
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, `matrix=${JSON.stringify({ include: candidates })}\n`);
          fs.appendFileSync(out, `candidate_count=${candidates.length}\n`);
          fs.appendFileSync(out, `output_branch=${outputBranch}\n`);
          fs.appendFileSync(out, `max_parallel=${maxParallel}\n`);
          NODE

  template:
    name: Build ${{ matrix.candidate_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: prepare
    if: needs.prepare.outputs.candidate_count != '0'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install descriptor tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Expand extracted candidate descriptors for cloud context
        run: python scripts/adstudio-build-extracted-meta-templates.py --limit 330

      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Run isolated Codex template worker
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ github.event.inputs.codex_model }}
          sandbox: workspace-write
          output-file: codex-${{ matrix.candidate_id }}.md
          prompt: |
            Follow .github/codex/prompts/adstudio-template-worker.md.

            Candidate ID: ${{ matrix.candidate_id }}
            Candidate number: ${{ matrix.candidate_number }}

            Create exactly this module:
            ${{ matrix.module_path }}

      - name: Collect one-template patch
        shell: bash
        run: |
          set -euo pipefail
          id="${{ matrix.candidate_id }}"
          module_path="${{ matrix.module_path }}"
          test -f "$module_path"
          git add -N "$module_path"
          git diff --check -- "$module_path"
          mkdir -p patches
          git diff --binary -- "$module_path" > "patches/${id}.patch"
          test -s "patches/${id}.patch"

      - name: Upload template patch
        uses: actions/upload-artifact@v5
        with:
          name: template-patch-${{ matrix.candidate_id }}
          path: patches/${{ matrix.candidate_id }}.patch
          if-no-files-found: error

      - name: Upload Codex summary
        uses: actions/upload-artifact@v5
        with:
          name: codex-summary-${{ matrix.candidate_id }}
          path: codex-${{ matrix.candidate_id }}.md
          if-no-files-found: ignore

  merge:
    name: Merge generated template patches
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - prepare
      - template
    if: needs.template.result == 'success'
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout output branch
        shell: bash
        env:
          OUTPUT_BRANCH: ${{ needs.prepare.outputs.output_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$OUTPUT_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$OUTPUT_BRANCH"; then
            git checkout -B "$OUTPUT_BRANCH" "origin/$OUTPUT_BRANCH"
          else
            git checkout -B "$OUTPUT_BRANCH"
          fi

      - name: Download template patches
        uses: actions/download-artifact@v5
        with:
          pattern: template-patch-*
          path: patches
          merge-multiple: true

      - name: Apply template patches
        shell: bash
        run: |
          set -euo pipefail
          for patch in $(find patches -name '*.patch' | sort); do
            git apply --whitespace=fix "$patch"
          done

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync gold template registry
        run: node scripts/adstudio-sync-gold-template-registry.mjs

      - name: Let Codex repair batch contract issues
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ github.event.inputs.codex_model }}
          sandbox: workspace-write
          output-file: codex-integrator.md
          prompt-file: .github/codex/prompts/adstudio-template-integrator.md

      - name: Re-sync registry after repair
        run: node scripts/adstudio-sync-gold-template-registry.mjs

      - name: Render and verify gold sample cards
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/adstudio-render-gold-template-sample-cards.mjs

      - name: Run focused template checks
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test tests/adstudio-extracted-meta-templates.test.ts tests/adstudio-template-library-order.test.ts tests/adstudio-template-preview.test.ts tests/adstudio-template-media-slots.test.ts tests/adstudio-template-design.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit and push batch
        shell: bash
        env:
          OUTPUT_BRANCH: ${{ needs.prepare.outputs.output_branch }}
        run: |
          set -euo pipefail
          git config user.name "codex-template-cloud"
          git config user.email "codex-template-cloud@users.noreply.github.com"
          git add src/lib/adstudio/gold-templates src/lib/adstudio/gold-adstudio-templates.ts public/adstudio-samples/gold tests/adstudio-extracted-meta-templates.test.ts tests/adstudio-template-library-order.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No template changes to commit."
            exit 0
          fi
          git commit -m "Promote cloud-generated ad studio template batch"
          git push origin "$OUTPUT_BRANCH"

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_BRANCH: ${{ needs.prepare.outputs.output_branch }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$OUTPUT_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --body "Updated with cloud-generated standalone Ad Studio templates from run $GITHUB_RUN_ID."
          else
            gh pr create \
              --head "$OUTPUT_BRANCH" \
              --base "${GITHUB_REF_NAME}" \
              --title "Promote cloud-generated Ad Studio templates" \
              --body "Cloud Codex workflow generated standalone template modules in isolated per-template jobs, synced the registry, rendered sample cards, and ran focused template checks."
          fi
