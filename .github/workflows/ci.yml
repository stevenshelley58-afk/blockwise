name: Release CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PRODUCT_IMAGE: blockwise-product:ci

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan repository history and working tree
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo:ro"
          -v "${{ github.workspace }}:/report"
          ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:e29229c8ad4038a586684ec85bd595c71b0627ea078e127f4e7e7f44a06d97b0
          git --redact --exit-code 1 --report-format sarif
          --report-path=/report/gitleaks-results.sarif
          --gitleaks-ignore-path=/repo/.gitleaksignore
          --log-opts="--all" /repo

      - name: Upload secret scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-scan-report
          path: gitleaks-results.sarif
          if-no-files-found: warn
          retention-days: 30

  product-image:
    name: Product image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the real product Dockerfile
        run: >-
          docker build --pull
          --tag "$PRODUCT_IMAGE"
          --file infra/product/Dockerfile
          --build-arg NEXT_PUBLIC_APP_URL=https://blockwise.sale
          --build-arg NEXT_PUBLIC_SITE_URL=https://blockwise.sale
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://blockwise.sale
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=oss-build-placeholder
          .

      - name: Smoke test the final image runtime
        run: |
          set -Eeuo pipefail
          test "$(docker image inspect "$PRODUCT_IMAGE" --format '{{.Config.User}}')" = "65532"
          test "$(docker image inspect "$PRODUCT_IMAGE" --format '{{json .Config.Entrypoint}}')" = '["/nodejs/bin/node"]'
          docker run --rm "$PRODUCT_IMAGE" -e "const fs=require('fs'); for (const p of ['server.js','public','.next/static']) if (!fs.existsSync(p)) process.exit(1)"
          container_id=$(docker run -d --user 65532:65532 --publish 18080:3000 \
            --env HOSTNAME=0.0.0.0 \
            --env PORT=3000 \
            --env NEXT_PUBLIC_APP_URL=https://blockwise.sale \
            --env NEXT_PUBLIC_SITE_URL=https://blockwise.sale \
            --env NEXT_PUBLIC_SUPABASE_URL=https://blockwise.sale \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY=oss-build-placeholder \
            "$PRODUCT_IMAGE")
          cleanup() { docker rm --force "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/health/live >/dev/null; then
              exit 0
            fi
            if ! docker ps --quiet --filter "id=$container_id" | grep -q .; then
              docker logs "$container_id" || true
              exit 1
            fi
            sleep 1
          done
          docker logs "$container_id" || true
          exit 1

      - name: Export image for security jobs
        run: docker save "$PRODUCT_IMAGE" | gzip -1 > product-image.tar.gz

      - name: Record immutable image evidence
        run: |
          echo "source_sha=$GITHUB_SHA" > product-image-evidence.txt
          docker image inspect "$PRODUCT_IMAGE" --format 'image_id={{.Id}}' >> product-image-evidence.txt
          echo "sha256=$(sha256sum product-image.tar.gz | cut -d' ' -f1)" >> product-image-evidence.txt

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-image
          path: product-image.tar.gz
          retention-days: 1

      - name: Upload immutable image evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-image-evidence
          path: product-image-evidence.txt
          retention-days: 30

  sbom:
    name: SBOM
    needs: product-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: product-image

      - name: Download immutable image evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: product-image-evidence

      - name: Load product image
        run: |
          expected=$(sed -n 's/^sha256=//p' product-image-evidence.txt)
          test -n "$expected"
          echo "$expected  product-image.tar.gz" | sha256sum --check
          gzip -dc product-image.tar.gz | docker load
          test "$(docker image inspect "$PRODUCT_IMAGE" --format '{{.Id}}')" = "$(sed -n 's/^image_id=//p' product-image-evidence.txt)"
          test "$(sed -n 's/^source_sha=//p' product-image-evidence.txt)" = "$GITHUB_SHA"

      - name: Bind SBOM to immutable image ID
        run: docker image inspect "$PRODUCT_IMAGE" --format 'image_id={{.Id}}' > sbom-image-binding.txt

      - name: Generate SPDX SBOM
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "${{ github.workspace }}:/work"
          docker.io/anchore/syft:v1.33.0@sha256:cefadcf11bd9cce9e3ec5248bb1538a84e33d519486c1b4523ac155c9b5f5033
          "$PRODUCT_IMAGE"
          -o spdx-json=/work/product-sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-sbom
          path: |
            product-sbom.spdx.json
            sbom-image-binding.txt
            product-image-evidence.txt
          if-no-files-found: error
          retention-days: 30

  container-scan:
    name: Container scan
    needs: product-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: product-image

      - name: Download immutable image evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: product-image-evidence

      - name: Load product image
        run: |
          expected=$(sed -n 's/^sha256=//p' product-image-evidence.txt)
          test -n "$expected"
          echo "$expected  product-image.tar.gz" | sha256sum --check
          gzip -dc product-image.tar.gz | docker load
          test "$(docker image inspect "$PRODUCT_IMAGE" --format '{{.Id}}')" = "$(sed -n 's/^image_id=//p' product-image-evidence.txt)"
          test "$(sed -n 's/^source_sha=//p' product-image-evidence.txt)" = "$GITHUB_SHA"

      - name: Bind Trivy report to immutable image ID
        run: docker image inspect "$PRODUCT_IMAGE" --format 'image_id={{.Id}}' > trivy-image-binding.txt

      - name: Confirm no Trivy exceptions are required
        run: test ! -e .trivyignore.yaml
        # The final distroless runtime has no previously excepted SQLite package.
        # Keep this assertion to prevent an inert ignore file from returning.
      - name: Scan product image for HIGH and CRITICAL vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "${{ github.workspace }}:/work"
          docker.io/aquasec/trivy:0.66.0@sha256:adbf5948d99de471725d37d2cfbd982178971d1cf081615284671d1c8ba99fb8
          image --scanners vuln
          --severity HIGH,CRITICAL
          --ignore-unfixed=false
          --exit-code 1
          --format sarif --output /work/trivy-results.sarif
          "$PRODUCT_IMAGE"

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-container-scan
          path: |
            trivy-results.sarif
            trivy-image-binding.txt
            product-image-evidence.txt
          if-no-files-found: warn
          retention-days: 30
