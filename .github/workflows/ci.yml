name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Playwright (authenticated capability matrix)
    runs-on: ubuntu-latest
    # The authenticated e2e needs a reachable app + seeded test users. It runs
    # when E2E_BASE_URL is configured (e.g. a preview deployment); otherwise it
    # is skipped so the required `check` gate is never blocked by missing infra.
    if: ${{ vars.E2E_BASE_URL != '' }}
    env:
      NEXT_PUBLIC_APP_URL: ${{ vars.E2E_BASE_URL }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
