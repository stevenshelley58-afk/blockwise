# Runs the Ad Studio real-loop e2e against every successful Vercel Preview
# deployment. This is the runtime gate the static CI cannot provide: it
# creates a real ad, edits copy, saves, reloads, and exports through the
# deployed app.
#
# Required repository secrets (the job FAILS loudly when they are missing —
# a silent skip is how runtime regressions shipped green for months):
#   ADSTUDIO_E2E_EMAIL           dedicated e2e login (e.g. adstudio-e2e@blockwise.test)
#   ADSTUDIO_E2E_PASSWORD        its password (>= 16 chars)
#   NEXT_PUBLIC_SUPABASE_URL     the Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY    service-role key (used only to seed the fixture)

name: AdStudio E2E (Vercel Preview)

on:
  deployment_status:

concurrency:
  group: adstudio-e2e-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  real-loop:
    name: Real-loop against preview
    if: >-
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment_status.environment, 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url }}
      ADSTUDIO_E2E_WORKSPACE_ID: 00000000-0000-4000-8000-0000000000e2
      ADSTUDIO_E2E_EMAIL: ${{ secrets.ADSTUDIO_E2E_EMAIL }}
      ADSTUDIO_E2E_PASSWORD: ${{ secrets.ADSTUDIO_E2E_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Require e2e secrets
        run: |
          missing=""
          [ -z "$ADSTUDIO_E2E_EMAIL" ] && missing="$missing ADSTUDIO_E2E_EMAIL"
          [ -z "$ADSTUDIO_E2E_PASSWORD" ] && missing="$missing ADSTUDIO_E2E_PASSWORD"
          [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] && missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Ad Studio real-loop e2e cannot run — missing repository secrets:$missing. Add them (see the header of this workflow file); do NOT disable this job, it is the only runtime gate."
            exit 1
          fi

      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Seed e2e user + workspace
        run: node scripts/e2e/seed-adstudio-e2e.mjs

      - name: Log in and capture storage state
        run: node scripts/e2e/login-storage-state.mjs

      - name: Run Ad Studio real loop
        env:
          # The spec's brand-kit approval scans a URL; the deployment's own
          # landing page is always fetchable and never an example.* host.
          ADSTUDIO_E2E_BRAND_URL: ${{ github.event.deployment_status.environment_url }}
        run: npx playwright test e2e/adstudio-real-loop.spec.ts --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: adstudio-e2e-report
          path: playwright-report
          retention-days: 7
