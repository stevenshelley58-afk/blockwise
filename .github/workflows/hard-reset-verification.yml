name: Hard Reset Verification

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contracts:
    name: Contract and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for NUL-byte corruption
        run: npm run check:nul

      - name: Run hard-reset verification
        run: npm run verify:hard-reset

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    name: Research card E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run hard-reset E2E
        run: npm run test:e2e:hard-reset
        env:
          BLOCKWISE_DEV_PASSWORD: ${{ secrets.BLOCKWISE_DEV_PASSWORD }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
