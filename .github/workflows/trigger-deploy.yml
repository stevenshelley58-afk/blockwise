# Deploys the trigger.dev background tasks (the async generation lane).
# Runs on main when task code changes, or manually via workflow_dispatch.
#
# Requires the Trigger credentials plus Vercel deployment credentials. The
# production Trigger key is fetched with the PAT after each task deployment,
# then written straight to Vercel without exposing it in logs or artifacts.
#   TRIGGER_ACCESS_TOKEN   personal access token from trigger.dev (Account -> API keys)
#   TRIGGER_PROJECT_ID     the project ref (proj_...) from the trigger.dev project settings
#   VERCEL_TOKEN           Vercel CLI token
#   VERCEL_PROJECT_ID      Blockwise Vercel project id
#   VERCEL_ORG_ID          owning Vercel team id

name: Deploy trigger.dev tasks

on:
  push:
    branches: [main]
    paths:
      - "trigger/**"
      - "trigger.config.ts"
      - ".github/workflows/trigger-deploy.yml"
  workflow_dispatch:

concurrency:
  group: trigger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tasks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
      TRIGGER_PROJECT_ID: ${{ secrets.TRIGGER_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
    steps:
      - name: Check for trigger.dev credentials
        id: gate
        run: |
          if [ -z "$TRIGGER_ACCESS_TOKEN" ] || [ -z "$TRIGGER_PROJECT_ID" ]; then
            echo "::error::TRIGGER_ACCESS_TOKEN / TRIGGER_PROJECT_ID secrets are required."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      # trigger.config.ts deliberately keeps a placeholder project ref
      # (enforced by test) — the real ref is passed only here.
      - name: Deploy to trigger.dev
        if: steps.gate.outputs.skip != 'true'
        run: npx trigger.dev@4.4.6 deploy --project-ref "$TRIGGER_PROJECT_ID"

      - name: Sync production Trigger key to Vercel
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/sync-trigger-key-to-vercel
