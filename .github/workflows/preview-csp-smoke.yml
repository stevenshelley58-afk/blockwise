name: Vercel Preview CSP Smoke
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Deployed Vercel Preview URL (https:// only; no localhost)"
        required: true
        type: string
jobs:
  browser-csp:
    name: Browser CSP smoke (Preview)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check deployed Preview CSP in a browser
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: npx playwright test tests/preview-csp-smoke.spec.ts

      - name: Upload Preview CSP report after success
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-csp-${{ github.run_id }}
          path: |
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
