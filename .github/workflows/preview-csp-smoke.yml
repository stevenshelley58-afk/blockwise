name: Vercel Preview CSP Smoke
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Deployed Vercel Preview URL (https:// only; no localhost)"
        required: true
        type: string
      source_sha:
        description: "Exact source SHA deployed to the Preview"
        required: true
        type: string
jobs:
  browser-csp:
    name: Browser CSP smoke (Preview)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate trusted Vercel Preview URL
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PY'
          import os, urllib.parse, re
          u = urllib.parse.urlparse(os.environ['PREVIEW_URL'])
          host = (u.hostname or '').lower()
          if u.scheme != 'https' or u.username or u.password or u.query or u.fragment:
              raise SystemExit('Preview URL must be credential-free HTTPS')
          if host not in {'blockwise-tan.vercel.app'} and not re.fullmatch(r'blockwise-[a-z0-9-]+\.vercel\.app', host):
              raise SystemExit('Preview URL is outside the Blockwise Vercel host allowlist')
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['EXPECTED_SHA']):
              raise SystemExit('source_sha must be a full Git SHA')
          if os.environ['EXPECTED_SHA'] != os.environ['GITHUB_SHA']:
              raise SystemExit('source_sha must equal the workflow source SHA')
          PY
      - name: Check deployed Preview CSP in a browser
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: npx playwright test tests/preview-csp-smoke.spec.ts

      - name: Upload Preview CSP report after success
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-csp-${{ github.run_id }}
          path: |
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
