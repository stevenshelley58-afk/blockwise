<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fc"/><stop offset="1" stop-color="#f7f6fc"/>
    </linearGradient>
    <radialGradient id="tintA" cx="18%" cy="12%" r="60%">
      <stop offset="0" stop-color="#e7eefb" stop-opacity=".9"/><stop offset="1" stop-color="#e7eefb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tintB" cx="88%" cy="92%" r="60%">
      <stop offset="0" stop-color="#efe9fb" stop-opacity=".9"/><stop offset="1" stop-color="#efe9fb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d8bff"/><stop offset="1" stop-color="#1f5fd6"/></linearGradient>
    <radialGradient id="gBlueR" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#4f97ff"/><stop offset="1" stop-color="#1f5fd6"/></radialGradient>
    <radialGradient id="gTealR" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#34dccb"/><stop offset="1" stop-color="#10a294"/></radialGradient>
    <linearGradient id="gBuild" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#1f6feb"/></linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#5a36e0"/></linearGradient>
    <linearGradient id="gVioletL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a7fff"/><stop offset="1" stop-color="#b39bff"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>

  <!-- page background -->
  <rect width="1600" height="1120" fill="#fafbfc"/>

  <!-- heading -->
  <g text-anchor="middle">
    <rect x="690" y="44" width="220" height="40" rx="20" fill="#ffffff" stroke="#e7e8ec"/>
    <circle cx="722" cy="64" r="5" fill="#1f6feb"/>
    <text x="812" y="70" font-size="20" font-weight="700" fill="#3a3f4a">How it works</text>
    <text x="800" y="138" font-size="44" font-weight="700" fill="#0f1115" letter-spacing="-1">Three steps. No ad agency.</text>
  </g>

  <!-- ===== ecosystem stage ===== -->
  <g>
    <rect x="80" y="178" width="1440" height="600" rx="28" fill="url(#bg)"/>
    <rect x="80" y="178" width="1440" height="600" rx="28" fill="url(#tintA)"/>
    <rect x="80" y="178" width="1440" height="600" rx="28" fill="url(#tintB)"/>

    <!-- faint placeholder tiles: cx,cy,size + glyph -->
    <g stroke="#e4e8f0" fill="#ffffff" fill-opacity=".30">
      <rect x="625" y="208" width="150" height="150" rx="20"/>
      <rect x="195" y="250" width="150" height="150" rx="20"/>
      <rect x="975" y="212" width="150" height="150" rx="20"/>
      <rect x="1190" y="218" width="140" height="140" rx="20"/>
      <rect x="1320" y="400" width="150" height="150" rx="20"/>
      <rect x="980" y="430" width="140" height="140" rx="20"/>
      <rect x="930" y="610" width="150" height="150" rx="20"/>
      <rect x="1170" y="615" width="140" height="140" rx="20"/>
      <rect x="1330" y="600" width="130" height="130" rx="20"/>
      <rect x="360" y="600" width="140" height="140" rx="20"/>
      <rect x="150" y="560" width="120" height="120" rx="20"/>
    </g>
    <g stroke="#c4ccda" stroke-opacity=".7" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(700,283)"><circle r="26"/><path d="M0,-15 V0 L13,8"/></g>
      <g transform="translate(270,325)"><rect x="-22" y="-22" width="28" height="28" rx="6"/><rect x="-4" y="-4" width="26" height="26" rx="6"/></g>
      <g transform="translate(1050,287)"><path d="M-22,-22 H6 L24,-2 V24 H-22 Z"/></g>
      <g transform="translate(1260,288)"><rect x="-22" y="2" width="10" height="18"/><rect x="-5" y="-12" width="10" height="32"/><rect x="12" y="-2" width="10" height="22"/></g>
      <g transform="translate(1395,475)"><rect x="-22" y="-22" width="26" height="26" rx="6"/><rect x="0" y="0" width="26" height="26" rx="6"/></g>
      <g transform="translate(1050,500)"><path d="M-22,12 L-4,-8 L8,4 L24,-16"/></g>
      <g transform="translate(1005,685)"><path d="M-24,16 L-6,-10 L6,6 L14,-6 L24,16 Z"/></g>
      <g transform="translate(1240,685)"><path d="M-8,-18 L14,4 L-8,26"/></g>
      <g transform="translate(1395,665)"><path d="M0,-20 L20,-9 V13 L0,24 L-20,13 V-9 Z"/></g>
      <g transform="translate(430,670)"><path d="M-22,12 L-4,-6 L8,2 L24,-16"/></g>
      <g transform="translate(210,620)"><circle r="24"/></g>
    </g>

    <!-- connector lines -->
    <path d="M372,470 H580 Q620,470 620,430 V416" fill="none" stroke="#2fbfb0" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M620,416 V524" fill="none" stroke="#c7cdda" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="372" cy="470" r="6" fill="#2fbfb0"/>

    <!-- ===== active node cards ===== -->
    <!-- shadows -->
    <g filter="url(#soft)">
      <rect x="162" y="402" width="210" height="150" rx="24" fill="#1f6feb" fill-opacity=".12"/>
      <rect x="515" y="272" width="210" height="150" rx="24" fill="#1f6feb" fill-opacity=".12"/>
      <rect x="515" y="532" width="210" height="150" rx="24" fill="#7c5cff" fill-opacity=".12"/>
    </g>

    <!-- Search node (center 267,470) -->
    <g>
      <rect x="162" y="395" width="210" height="150" rx="24" fill="#ffffff" stroke="#eef0f4"/>
      <g transform="translate(267,452)">
        <circle cx="-15" cy="0" r="22" fill="url(#gBlueR)"/>
        <circle cx="15" cy="0" r="22" fill="url(#gTealR)" fill-opacity=".9"/>
      </g>
      <text x="267" y="505" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">Search</text>
      <text x="267" y="528" text-anchor="middle" font-size="16" font-weight="600" fill="#8a90a0">your suburb</text>
    </g>

    <!-- Build node (center 620,340) -->
    <g>
      <rect x="515" y="265" width="210" height="150" rx="24" fill="#ffffff" stroke="#eef0f4"/>
      <rect x="597" y="300" width="46" height="46" rx="13" fill="url(#gBuild)"/>
      <path d="M627,308 L612,332 H623 L621,348 L636,326 H626 Z" fill="#ffffff"/>
      <text x="620" y="378" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">Build</text>
      <text x="620" y="401" text-anchor="middle" font-size="16" font-weight="600" fill="#8a90a0">we write the ad</text>
    </g>

    <!-- Approve node (center 620,600) -->
    <g>
      <rect x="515" y="525" width="210" height="150" rx="24" fill="#ffffff" stroke="#eef0f4"/>
      <g transform="translate(620,560)">
        <rect x="-22" y="14" width="44" height="13" rx="6" fill="url(#gVioletL)"/>
        <rect x="-18" y="4" width="36" height="13" rx="6" fill="#9a7fff"/>
        <rect x="-15" y="-10" width="30" height="18" rx="6" fill="url(#gViolet)"/>
        <path d="M-7,-1 L-2,4 L7,-6" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="620" y="638" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1115">Approve</text>
      <text x="620" y="661" text-anchor="middle" font-size="16" font-weight="600" fill="#8a90a0">one tap, go live</text>
    </g>
  </g>

  <!-- ===== caption row ===== -->
  <g>
    <!-- col 1 -->
    <g transform="translate(110,840)">
      <rect x="0" y="-22" width="30" height="30" rx="8" fill="url(#gBlue)"/>
      <text x="15" y="-1" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1</text>
      <text x="44" y="2" font-size="25" font-weight="700" fill="#0f1115">Search your area</text>
      <text font-size="20" fill="#3a3f4a">
        <tspan x="0" y="48">See every property ad running near you —</tspan>
        <tspan x="0" y="78">the angles, agencies and platforms that</tspan>
        <tspan x="0" y="108">are live right now.</tspan>
      </text>
    </g>
    <!-- col 2 -->
    <g transform="translate(620,840)">
      <rect x="0" y="-22" width="30" height="30" rx="8" fill="url(#gBuild)"/>
      <text x="15" y="-1" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>
      <text x="44" y="2" font-size="25" font-weight="700" fill="#0f1115">We build your ad</text>
      <text font-size="20" fill="#3a3f4a">
        <tspan x="0" y="48">Written from what's actually working in</tspan>
        <tspan x="0" y="78">your suburb — copy, creative and a lead</tspan>
        <tspan x="0" y="108">form, ready to go.</tspan>
      </text>
    </g>
    <!-- col 3 -->
    <g transform="translate(1130,840)">
      <rect x="0" y="-22" width="30" height="30" rx="8" fill="url(#gViolet)"/>
      <text x="15" y="-1" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">3</text>
      <text x="44" y="2" font-size="25" font-weight="700" fill="#0f1115">Approve &amp; go live</text>
      <text font-size="20" fill="#3a3f4a">
        <tspan x="0" y="48">One tap to approve. It runs through your</tspan>
        <tspan x="0" y="78">own ad account and the leads start</tspan>
        <tspan x="0" y="108">coming in.</tspan>
      </text>
    </g>
  </g>
</svg>
