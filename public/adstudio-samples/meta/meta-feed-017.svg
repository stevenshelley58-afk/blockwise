  <clipPath id="clip-meta-feed-017-trust-note"><rect x="52" y="1168" width="976" height="56"/></clipPath>
  <text x="52" y="1312" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="400" fill="#aaaaaa" clip-path="url(#clip-meta-feed-017-footer-disclaimer)">Results may vary. Past sales do not guarantee future price.</text>
