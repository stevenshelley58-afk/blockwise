  <rect x="0" y="660" width="1080" height="690" fill="#f7f3eb" rx="0"/>
  <rect x="52" y="696" width="6" height="120" fill="#2c5f5a" rx="0"/>
  <text x="78" y="730" text-anchor="start" font-family="sans-serif" font-size="30" font-weight="700" fill="#2c5f5a" clip-path="url(#clip-meta-feed-017-buyer-demand-label)">We still have buyers looking in your area.</text>
  <clipPath id="clip-meta-feed-017-buyer-demand-label"><rect x="78" y="700" width="950" height="90"/></clipPath>
  <text x="78" y="794" text-anchor="start" font-family="sans-serif" font-size="26" font-weight="400" fill="#4a4a4a" clip-path="url(#clip-meta-feed-017-body-text)">21 Apalie Trail, Edgewater has sold for a great price. We still have buyers looking in your area — free property appraisal and area report available.</text>
  <clipPath id="clip-meta-feed-017-body-text"><rect x="78" y="768" width="950" height="126"/></clipPath>
  <rect x="52" y="900" width="976" height="2" fill="#d4c9b0" rx="0"/>
  <text x="52" y="946" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="700" fill="#2c5f5a" clip-path="url(#clip-meta-feed-017-offer-tag)">FREE PROPERTY APPRAISAL + AREA REPORT</text>
  <clipPath id="clip-meta-feed-017-offer-tag"><rect x="52" y="924" width="976" height="62"/></clipPath>
  <text x="52" y="990" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="400" fill="#6b6b6b" clip-path="url(#clip-meta-feed-017-offer-subtext)">Understand your home's value in today's market — no obligation.</text>
  <clipPath id="clip-meta-feed-017-offer-subtext"><rect x="52" y="968" width="976" height="72"/></clipPath>
  <rect x="52" y="1058" width="400" height="88" fill="#2c5f5a" rx="44"/>
  <text x="252" y="1110" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#ffffff" clip-path="url(#clip-meta-feed-017-cta-text)">Free Appraisal</text>
  <clipPath id="clip-meta-feed-017-cta-text"><rect x="72" y="1082" width="360" height="68"/></clipPath>
