<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123e75" />
    <title>Blockwise offline</title>
    <style>
      :root {
        color: #123e75;
        background: #ffffff;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }

      .mark span {
        border-radius: 3px;
        background: currentColor;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      p {
        margin: 12px 0 0;
        color: #385b7d;
        font-size: 16px;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 24px;
        padding: 0 18px;
        border-radius: 6px;
        background: #123e75;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <span style="grid-column: 3; grid-row: 1"></span>
        <span style="grid-column: 2; grid-row: 2"></span>
        <span style="grid-column: 3; grid-row: 2"></span>
        <span style="grid-column: 1; grid-row: 3"></span>
        <span style="grid-column: 2; grid-row: 3"></span>
        <span style="grid-column: 3; grid-row: 3"></span>
      </div>
      <h1>Blockwise is offline</h1>
      <p>Reconnect to open your workspace and continue managing campaigns.</p>
      <a href="/pwa?source=offline">Try again</a>
    </main>
  </body>
</html>
