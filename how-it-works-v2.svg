<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <radialGradient id="atmoA" cx="20%" cy="20%" r="55%"><stop offset="0" stop-color="#e8eefb" stop-opacity=".8"/><stop offset="1" stop-color="#e8eefb" stop-opacity="0"/></radialGradient>
    <radialGradient id="atmoB" cx="82%" cy="85%" r="55%"><stop offset="0" stop-color="#ece7fb" stop-opacity=".8"/><stop offset="1" stop-color="#ece7fb" stop-opacity="0"/></radialGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f97ff"/><stop offset="1" stop-color="#1f5fd6"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fd2c2"/><stop offset="1" stop-color="#10a294"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a7fff"/><stop offset="1" stop-color="#5a36e0"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f97ff"/><stop offset="0.5" stop-color="#2fd2c2"/><stop offset="1" stop-color="#9a7fff"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1f3a7a" flood-opacity="0.10"/></filter>
  </defs>

  <rect width="1600" height="760" fill="#fafbfc"/>
  <rect width="1600" height="760" fill="url(#atmoA)"/>
  <rect width="1600" height="760" fill="url(#atmoB)"/>

  <!-- heading -->
  <g text-anchor="middle">
    <rect x="690" y="40" width="220" height="40" rx="20" fill="#ffffff" stroke="#e7e8ec"/>
    <circle cx="722" cy="60" r="5" fill="#1f6feb"/>
    <text x="812" y="66" font-size="20" font-weight="700" fill="#3a3f4a">How it works</text>
    <text x="800" y="132" font-size="44" font-weight="700" fill="#0f1115" letter-spacing="-1">Three steps. No ad agency.</text>
  </g>

  <!-- connector rail behind cards -->
  <line x1="280" y1="330" x2="1320" y2="330" stroke="url(#rail)" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <!-- chevrons in the gaps -->
  <path d="M548,318 l14,12 l-14,12" fill="none" stroke="#2fd2c2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1040,318 l14,12 l-14,12" fill="none" stroke="#9a7fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== three step cards ===== -->
  <!-- card 1 -->
  <g>
    <rect x="100" y="210" width="420" height="430" rx="26" fill="#ffffff" stroke="#eef0f4" filter="url(#cardShadow)"/>
    <text x="476" y="270" text-anchor="end" font-size="30" font-weight="700" fill="#e6e9f0">01</text>
    <rect x="140" y="248" width="84" height="84" rx="22" fill="url(#c1)"/>
    <g transform="translate(182,290)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="-4" cy="-4" r="14"/><path d="M7,7 L18,18"/></g>
    <text x="140" y="410" font-size="32" font-weight="700" fill="#0f1115">Search your area</text>
    <text font-size="21" fill="#3a3f4a">
      <tspan x="140" y="456">See every property ad running</tspan>
      <tspan x="140" y="488">near you — the angles, agencies</tspan>
      <tspan x="140" y="520">and platforms live right now.</tspan>
    </text>
  </g>

  <!-- card 2 -->
  <g>
    <rect x="590" y="210" width="420" height="430" rx="26" fill="#ffffff" stroke="#eef0f4" filter="url(#cardShadow)"/>
    <text x="966" y="270" text-anchor="end" font-size="30" font-weight="700" fill="#e6e9f0">02</text>
    <rect x="630" y="248" width="84" height="84" rx="22" fill="url(#c2)"/>
    <path d="M676,266 L656,300 H672 L669,322 L692,286 H676 Z" fill="#ffffff"/>
    <text x="630" y="410" font-size="32" font-weight="700" fill="#0f1115">We build your ad</text>
    <text font-size="21" fill="#3a3f4a">
      <tspan x="630" y="456">Written from what's working in</tspan>
      <tspan x="630" y="488">your suburb — copy, creative</tspan>
      <tspan x="630" y="520">and a lead form, ready to go.</tspan>
    </text>
  </g>

  <!-- card 3 -->
  <g>
    <rect x="1080" y="210" width="420" height="430" rx="26" fill="#ffffff" stroke="#eef0f4" filter="url(#cardShadow)"/>
    <text x="1456" y="270" text-anchor="end" font-size="30" font-weight="700" fill="#e6e9f0">03</text>
    <rect x="1120" y="248" width="84" height="84" rx="22" fill="url(#c3)"/>
    <path d="M1148,292 l11,11 l20,-22" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1120" y="410" font-size="32" font-weight="700" fill="#0f1115">Approve &amp; go live</text>
    <text font-size="21" fill="#3a3f4a">
      <tspan x="1120" y="456">One tap to approve. It runs</tspan>
      <tspan x="1120" y="488">through your own ad account</tspan>
      <tspan x="1120" y="520">and the leads start coming in.</tspan>
    </text>
  </g>
</svg>
